function entitySubtitle(type,d){
  if(type==='hf'){
    const bits=[d.race,d.caste||d.sex].filter(Boolean).join(' · ');
    const life = `${fmtYear(d.birth_year)} – ${fmtYear(d.death_year)}`;
    const alive = (d.death_year==null||d.death_year===-1)?' <span class="pill">living</span>':'';
    return `<div class="muted">${esc(bits)} &nbsp; · &nbsp; ${life}${alive}</div>`;
  }
  if(type==='site') return `<div class="muted">${esc(d.type||'')}${d.coords?` · <span class="mono">${esc(d.coords)}</span>`:''}</div>`;
  if(type==='artifact') return `<div class="muted">${[d.material,d.item_type,d.item_subtype].filter(Boolean).map(esc).join(' · ')}</div>`;
  if(type==='ent') return `<div class="muted">${[d.type,d.race].filter(Boolean).map(esc).join(' · ')}</div>`;
  if(type==='wc') return `<div class="muted">${esc(d.form||'')}</div>`;
  if(type==='creature') return `<div class="muted">${d.is_monster?'Wild / monstrous':'Wildlife'} · ${(d.population_named||0).toLocaleString()} named in the record</div>`;
  return '';
}

function entityFactbox(type,d){
  let rows=[];
  if(type==='hf'){
    if(d.race) rows.push(['Race',esc(d.race)]);
    if(d.caste||d.sex) rows.push(['Sex',esc(d.caste||d.sex)]);
    rows.push(['Born',fmtYear(d.birth_year)]);
    // a death year alone doesn't tell you whether someone was cut down young
    // or died full of years. The age is the part that actually lands
    let diedCell=fmtYear(d.death_year);
    // DF uses -1 (and sometimes null) to mean "still alive". That matters
    // here because plenty of figures have NEGATIVE birth years. For someone
    // born in -18, a naive `death >= birth` test treats the -1 sentinel as a
    // real death year and prints a nonsense age.
    const alive = d.death_year==null || d.death_year===-1;
    if(!alive && d.birth_year!=null && d.birth_year!==-1 && d.death_year>=d.birth_year){
      diedCell+=` <span class="age-at-death">(aged ${d.death_year-d.birth_year})</span>`;
    }
    rows.push(['Died',diedCell]);
    if(d.associated_type) rows.push(['Role',esc(d.associated_type)]);
    rows.push(['Events',d.event_count]);
    let extra='';
    if(d.spheres&&d.spheres.length) extra+=`<div class="fb-group"><div class="struct-t">Spheres</div>${d.spheres.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div>`;
    // show more of the record now that the box has room for it
    if(d.skills&&d.skills.length){const top=d.skills.slice().sort((a,b)=>(b.ip||0)-(a.ip||0)).slice(0,14);
      extra+=`<div class="fb-group"><div class="struct-t">Notable skills</div>${top.map(s=>`<span class="pill">${esc(s.skill)}</span>`).join('')}</div>`;}
    // entity_links_h is [{link:'member', ent:{...linkTok shape}}]
    if(d.entity_links_h&&d.entity_links_h.length) extra+=`<div class="fb-group"><div class="struct-t">Affiliations</div>`+
      d.entity_links_h.slice(0,8).map(e=>`<div class="fb-line">${linkTok(e.ent)}${e.link?` <span class="muted small">${esc(e.link)}</span>`:''}</div>`).join('')+`</div>`;
    if(d.site_links_h&&d.site_links_h.length) extra+=`<div class="fb-group"><div class="struct-t">Connected places</div>`+
      d.site_links_h.slice(0,6).map(e=>`<div class="fb-line">${linkTok(e.site)}${e.link?` <span class="muted small">${esc(e.link)}</span>`:''}</div>`).join('')+`</div>`;
    return factboxHtml('Vital record',rows,extra);
  }
  if(type==='site'){
    if(d.type) rows.push(['Type',esc(d.type)]);
    if(d.coords) rows.push(['Coords',`<span class="mono">${esc(d.coords)}</span>`]);
    rows.push(['Structures',(d.structures||[]).length]);
    rows.push(['Events',d.event_count]);
    let extra='';
    if(d.owners_h&&d.owners_h.length) extra+=`<div style="margin-top:8px"><div class="struct-t">Controlled by</div>${d.owners_h.map(o=>linkTok(o)).join('<br>')}</div>`;
    return factboxHtml('Site record',rows,extra);
  }
  if(type==='artifact'){
    if(d.material) rows.push(['Material',esc(d.material)]);
    if(d.item_type) rows.push(['Item',esc(d.item_type)]);
    if(d.holder_h) rows.push(['Held by',linkTok(d.holder_h)]);
    rows.push(['Events',d.event_count]);
    return factboxHtml('Artifact record',rows,'');
  }
  if(type==='ent'){
    if(d.type) rows.push(['Type',esc(d.type)]);
    if(d.race) rows.push(['Race',esc(d.race)]);
    if(d.n_members) rows.push(['Members',d.n_members.toLocaleString()]);
    if(d.owned_sites_h) rows.push(['Sites held',d.owned_sites_h.length]);
    rows.push(['Events',d.event_count]);
    return factboxHtml('Civilization record',rows,'');
  }
  if(type==='wc'){
    if(d.form) rows.push(['Form',esc(d.form)]);
    if(d.author_h) rows.push(['Author',linkTok(d.author_h)]);
    if(d.styles&&d.styles.length) rows.push(['Style',d.styles.map(esc).join(', ')]);
    return factboxHtml('Work record',rows,'');
  }
  if(type==='creature'){
    rows.push(['Named individuals',(d.population_named||0).toLocaleString()]);
    rows.push(['Recorded events',(d.total_events||0).toLocaleString()]);
    rows.push(['Nature',d.is_monster?'Wild / monstrous':'Wildlife']);
    let extra='';
    if(d.top_biomes&&d.top_biomes.length) extra+=`<div style="margin-top:8px"><div class="struct-t">Most sighted in</div>${d.top_biomes.map(b=>`<span class="pill">${esc(b)}</span>`).join('')}</div>`;
    return factboxHtml('Bestiary record',rows,extra);
  }
  return '';
}
/* A real infobox: proper table rows, labels right-aligned against
   left-aligned values, the way a Wikipedia sidebar reads. Custom
   user-authored rows append underneath the real data and can be edited or
   removed; nothing generated ever writes into them. */
/* ============================================================
   LEAD PARAGRAPH
   An encyclopedia article opens by telling you what the thing IS,
   in one bolded sentence, before any section heading. That single
   line does most of the orienting work. It's the difference
   between "a page of facts" and "an article".
   ============================================================ */
/* Star an image to make it this entity's card thumbnail in browse grids.
   One star per entity. Starring a second image moves the star. */
async function starImage(imgId){
  const d=STATE.entity;
  await apiPost(`/gallery/${STATE.world}/${d._etype}/${d.id}`,{action:'star',id:imgId});
  if(window.playSfx) playSfx('uiClick',0.35);
  route();
}

/* Jump to a random page of whatever type you're browsing, or, when
   there's no browse context to inherit, which is the header button's
   situation on basically every page. A random page of a random type,
   rather than defaulting to figures every time. */
async function randomPage(type){
  const types = Object.keys(TYPE_PLURAL);
  const browseType = (location.hash.match(/\/browse\/(\w+)/)||[])[1];
  let t = type || browseType || types[Math.floor(Math.random()*types.length)];
  try{
    let d=await api(`/w/${STATE.world}/list/${t}?per=1&page=0`);
    // no browse context means any type was fair game, if the one we
    // rolled happens to be empty in this world, try a few others rather
    // than just giving up
    let tries=0;
    while(!d.total && !type && !browseType && tries<5){
      t = types[Math.floor(Math.random()*types.length)];
      d = await api(`/w/${STATE.world}/list/${t}?per=1&page=0`);
      tries++;
    }
    if(!d.total){ toast('Nothing to pick from.'); return; }
    const n=Math.floor(Math.random()*d.total);
    const pick=await api(`/w/${STATE.world}/list/${t}?per=1&page=${n}`);
    const it=pick.items&&pick.items[0];
    if(!it){ toast('Could not find one. Try again.'); return; }
    if(window.playSfx) playSfx('pageTurn',0.4);
    location.hash=`#/w/${STATE.world}/${t}/${it.id}`;
  }catch(e){ toast('Random pick failed: '+e.message); }
}

/* ---- header settings menu ----
   The old header had five unrelated controls sitting in a row. They're one
   menu now. Their old standalone buttons are gone entirely. A `hidden`
   attribute loses to .icon-btn{display:inline-flex}, so leaving them in the
   DOM produced two empty boxes in the header. The toggles null-check
   instead. */
function closeSettingsMenu(){ const w=document.getElementById('settingsWrap'); if(w) w.classList.remove('open'); }
function toggleSettingsMenu(ev){
  ev&&ev.stopPropagation();
  const w=document.getElementById('settingsWrap'); if(!w) return;
  const opening=!w.classList.contains('open');
  w.classList.toggle('open',opening);
  if(opening) syncSettingsLabels();
}
function syncSettingsLabels(){
  const ts=document.getElementById('themeSelect');
  if(ts) ts.value = localStorage_get('theme') || (document.body.classList.contains('dark-mode')?'dark':'light');
  const sx=document.getElementById('sfxLabel');
  if(sx) sx.textContent=(typeof sfxMuted!=='undefined'&&sfxMuted)?'Page sounds  (off)':'Page sounds  \u2713';
}
document.addEventListener('click', e=>{ if(!e.target.closest('.settings-wrap')) closeSettingsMenu(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSettingsMenu(); });

/* "a orc" / "an alligator". DF race and creature-type names aren't
   predictable enough to hardcode, so this picks the article the same way
   a human writer would: vowel-sound-first gets "an". Good enough for the
   plain English words these fields actually contain. */
function aOrAn(word){ return /^[aeiou]/i.test(word||'') ? 'an' : 'a'; }

function leadParagraph(type,d){
  const name=esc(properName(d.name||d.title)||'This entry');
  let lead='';
  if(type==='hf'){
    const bits=[];
    if(d.race) bits.push(esc(d.race));
    if(d.caste||d.sex) bits.push(esc(d.caste||d.sex));
    const alive=d.death_year==null||d.death_year===-1;
    let span='';
    if(d.birth_year!=null&&d.birth_year!==-1){
      span = alive ? `born in ${fmtYear(d.birth_year)}`
                   : `${fmtYear(d.birth_year)}–${fmtYear(d.death_year)}`;
    }
    const kind=bits.join(' ')||'figure';
    lead=`<strong>${name}</strong>${d.epithet?`, called <em>${esc(d.epithet)}</em>,`:''} was ${aOrAn(kind)} ${kind}`+
      (span?` (${span})`:'')+
      (d.associated_type?` who worked as a ${esc(d.associated_type)}`:'')+
      `. The annals record <strong>${(d.event_count||0).toLocaleString()}</strong> event${d.event_count===1?'':'s'} in which ${alive?'they appear':'they appeared'}.`;
  }else if(type==='site'){
    lead=`<strong>${name}</strong> is a ${esc(d.type||'settlement')}`+
      (d.coords?` located at <span class="mono">${esc(d.coords)}</span>`:'')+
      `, with ${(d.structures||[]).length} recorded structure${(d.structures||[]).length===1?'':'s'} and `+
      `<strong>${(d.event_count||0).toLocaleString()}</strong> recorded event${d.event_count===1?'':'s'}.`;
  }else if(type==='ent'){
    lead=`<strong>${name}</strong> is a ${esc(d.type||'group')}`+(d.race?` of ${esc(d.race)}s`:'')+
      `, appearing in <strong>${(d.event_count||0).toLocaleString()}</strong> recorded event${d.event_count===1?'':'s'}.`;
  }else if(type==='artifact'){
    lead=`<strong>${name}</strong> is an artifact`+
      ([d.material,d.item_type].filter(Boolean).length?`, ${[d.material,d.item_type].filter(Boolean).map(esc).join(' ')}`:'')+`.`;
  }else if(type==='creature'){
    lead=`<strong>${name}</strong> is ${d.is_monster?'a wild or monstrous':'a'} creature of this world, with `+
      `<strong>${(d.population_named||0).toLocaleString()}</strong> named individual${d.population_named===1?'':'s'} in the record.`;
  }else if(type==='wc'){
    lead=`<strong>${name}</strong> is a ${esc(d.form||'written work')}`+
      (d.author_h?` attributed to ${linkTok(d.author_h)}`:'')+`.`;
  }else if(type==='region'){
    lead=`<strong>${name}</strong> is a region of this world`+
      (d.type?`, ${esc(d.type)}`:'')+
      `, appearing in <strong>${(d.event_count||0).toLocaleString()}</strong> recorded event${d.event_count===1?'':'s'}.`;
  }
  return lead ? `<p class="lead-para">${lead}</p>` : '';
}

/* ============================================================
   CONTENTS
   A numbered, collapsible index of the article's own sections,
   sitting where Wikipedia puts it: after the lead, before the
   first heading. Built from the sections that actually rendered,
   so it can never list something that isn't there.
   ============================================================ */
/* The contents list, as a sticky left rail. Same data as before; it just
   lives beside the article now instead of interrupting it. */
function railHtml(d){
  const items=(d.flavor||[]).map(c=>({id:'sec-'+c.key,label:c.label}));
  if(items.length<3) return '';
  return `<nav class="toc open" id="tocBox">
    <div class="toc-head" onclick="toggleRail()">
      <span class="toc-arrow">&#9662;</span><span class="toc-title">Contents</span>
      <span class="toc-count">${items.length}</span>
    </div>
    <ol class="toc-list">`+
    items.map((it,i)=>`<li><a href="#${it.id}" onclick="return jumpToSection('${it.id}')"><span class="toc-n">${i+1}</span>${esc(it.label)}</a></li>`).join('')+
    `</ol></nav>`;
}
function toggleRail(){
  const hidden=document.body.classList.toggle('rail-hidden');
  const art=document.querySelector('.article');
  if(art) art.classList.toggle('no-rail', hidden);
  try{ localStorage.setItem('railHidden', hidden?'1':'0'); }catch(e){}
  if(window.playSfx) playSfx(hidden?'sectionClose':'sectionOpen',0.3);
}
(function(){ try{ if(localStorage.getItem('railHidden')==='1')
  document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('rail-hidden')); }catch(e){} })();

function tocHtml(d){
  const items=[];
  if(d.flavor&&d.flavor.length) d.flavor.forEach(c=>items.push({id:'sec-'+c.key,label:c.label}));
  const open=localStorage_get('tocOpen')!=='0';
  if(items.length<3) return '';   // a two-item contents list is just noise
  return `<nav class="toc${open?' open':''}" id="tocBox">
    <div class="toc-head" onclick="toggleToc()">
      <span class="toc-arrow">&#9662;</span><span class="toc-title">Contents</span>
      <span class="toc-count">${items.length}</span>
    </div>
    <ol class="toc-list">`+
    items.map((it,i)=>`<li><a href="#${it.id}" onclick="return jumpToSection('${it.id}')"><span class="toc-n">${i+1}</span>${esc(it.label)}</a></li>`).join('')+
    `</ol></nav>`;
}
function toggleToc(){
  const b=document.getElementById('tocBox'); if(!b) return;
  const open=!b.classList.contains('open');
  b.classList.toggle('open',open);
  localStorage_set('tocOpen',open?'1':'0');
  if(window.playSfx) playSfx(open?'sectionOpen':'sectionClose',0.35);
}
function jumpToSection(id){
  const el=document.getElementById(id);
  if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
  return false;
}

function factboxHtml(title,rows,extra,opts){
  opts=opts||{};
  const d=STATE.entity||{};
  const custom=(d._vitals||[]);
  // A starred image belongs at the top of the record, not buried in a gallery
  // further down. It's the first thing you want when you open a page.
  const star=(d._gallery||[]).find(im=>im.starred) || (d._gallery||[])[0];
  let h=`<aside class="factbox"><div class="fb-title">${title}</div>`;
  if(star){
    h+=`<figure class="fb-portrait" onclick="openLightbox('${star.id}')" title="${esc(star.caption||'')}">
      <img src="/userdata/images/${esc(star.filename)}" alt="${esc(star.caption||title)}" loading="lazy">
      ${star.caption?`<figcaption>${esc(star.caption)}</figcaption>`:''}
    </figure>`;
  }
  h+=`<table class="fb-table"><tbody>`;
  h+=rows.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('');
  h+=custom.map((f,i)=>`<tr class="fb-custom"><th>${esc(f.label)}</th><td>${esc(f.value)||'<span class="muted">-</span>'}
      <button class="fb-x" title="Remove this field" onclick="removeVitalField(${i})">&times;</button></td></tr>`).join('');
  h+=`</tbody></table>`;
  if(opts.editable!==false){
    h+=`<div class="fb-add"><button class="lore-toggle" onclick="addVitalField()">+ Add a field</button></div>`;
  }
  h+=(extra||'')+`</aside>`;
  return h;
}
/* ---- user-authored infobox rows ---- */
async function addVitalField(){
  const label=prompt('Field name (e.g. Epithet, Cause of death, Allegiance):');
  if(!label||!label.trim()) return;
  const value=prompt(`Value for "${label.trim()}" (leave blank to fill in later):`)||'';
  const d=STATE.entity;
  await apiPost(`/vitals/${STATE.world}/${d._etype}/${d.id}`,{action:'set',label:label.trim(),value:value.trim()});
  d._vitals=(await api(`/vitals/${STATE.world}/${d._etype}/${d.id}`)).fields;
  route();
}
async function removeVitalField(i){
  const d=STATE.entity;
  await apiPost(`/vitals/${STATE.world}/${d._etype}/${d.id}`,{action:'remove',index:i});
  d._vitals=(await api(`/vitals/${STATE.world}/${d._etype}/${d.id}`)).fields;
  route();
}
/* ============================================================
   SECTION TOOLS MENU
   The per-section controls used to be seven bracketed links in a
   row, which is a lot of visual noise sitting on top of prose you
   are trying to read. They collapse into one "Tools" popover now;
   the two things you actually reach for often (images, and the
   collapse toggle) stay one click away.
   ============================================================ */
function closeToolsMenu(){
  document.querySelectorAll('.tools-wrap.open').forEach(w=>w.classList.remove('open'));
}
function toggleToolsMenu(btn){
  const wrap=btn.closest('.tools-wrap');
  const wasOpen=wrap.classList.contains('open');
  closeToolsMenu();
  if(!wasOpen){ wrap.classList.add('open'); if(window.playSfx) playSfx('uiClick',0.3); }
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.tools-wrap')) closeToolsMenu();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeToolsMenu(); });

/* ============================================================
   PER-SECTION GALLERY
   Images tagged with a section's own label render inline, right
   under that heading, and push the prose down rather than
   floating over it. Untagged images stay in the page gallery at
   the bottom, which is what the header "Image" button feeds.
   ============================================================ */
/* Split the leading letter into its own element. Skips gracefully when the
   passage opens with punctuation or is empty, rather than making a drop cap
   out of a quote mark. */
function dropCap(text){
  return esc(String(text||''));
}

function sectionImages(label){
  const d=STATE.entity;
  if(!d || !d._gallery) return [];
  const want=(label||'').trim().toLowerCase();
  return d._gallery.filter(im=>(im.caption||'').trim().toLowerCase()===want);
}
function toggleSectionGallery(btn, label){
  const sec=btn.closest('.lore-section');
  const box=sec.querySelector('.section-gallery');
  if(!box) return;
  if(!box.hasAttribute('hidden')){
    box.setAttribute('hidden',''); box.innerHTML='';
    btn.classList.remove('active');
    if(window.playSfx) playSfx('sectionClose',0.35);
    return;
  }
  const imgs=sectionImages(label);
  if(!imgs.length){
    box.innerHTML=`<div class="sg-empty">No images attached to &ldquo;${esc(label)}&rdquo; yet.
      <button class="lore-toggle" onclick="addGalleryImage('${jsAttr(label)}')">Attach one &rarr;</button></div>`;
  }else{
    box.innerHTML=`<div class="sg-grid">`+imgs.map(im=>
      `<figure class="sg-item" onclick="openLightbox('${im.id}')">
         <img src="/userdata/images/${esc(im.filename)}" loading="lazy" alt="${esc(label)}">
       </figure>`).join('')+
      `</div>`;
  }
  box.removeAttribute('hidden');
  btn.classList.add('active');
  if(window.playSfx) playSfx('sectionOpen',0.35);
}

function gallerySidebarHtml(d){
  if(!d._gallery || !d._gallery.length) return '';
  return `<div class="factbox gallery-sidebar"><h4>Gallery <span class="n">${d._gallery.length}</span></h4>
    <div class="gallery-grid-sb">`+
    d._gallery.map(im=>`<div class="gallery-item${im.starred?' starred':''}" data-img-id="${im.id}">
      <img src="/userdata/images/${esc(im.filename)}" loading="lazy" onclick="openLightbox('${im.id}')">
      <button class="gi-star" title="${im.starred?'This is the card thumbnail':'Use as this page\'s card thumbnail'}"
        onclick="event.stopPropagation();starImage('${im.id}')">${im.starred?'&#9733;':'&#9734;'}</button>
      ${im.caption?`<div class="gi-cap">${esc(im.caption)}</div>`:''}
    </div>`).join('')+
    `</div></div>`;
}
function mapSwatchHtml(coords){
  if(!coords) return '';
  const [x,y]=coords.split(',').map(Number);
  return `<div class="factbox map-swatch-box">
    <button class="small-btn" onclick="toggleMapSwatch(this,${x},${y})">🗺 Show location on map</button>
    <div class="map-swatch" style="display:none"></div>
  </div>`;
}
let _swatchMapMeta=null;
async function toggleMapSwatch(btn,x,y){
  const box=btn.nextElementSibling;
  const showing=box.style.display!=='none';
  if(showing){ box.style.display='none'; btn.textContent='🗺 Show location on map'; return; }
  btn.textContent='🗺 Hide map'; box.style.display='block';
  if(box.dataset.built) return;
  box.dataset.built='1';
  if(!_swatchMapMeta) _swatchMapMeta=await api(`/w/${STATE.world}/map.json`);
  const mj=_swatchMapMeta;
  const SWATCH=200, ZOOM=4.2;
  const bgW=mj.width*ZOOM, bgH=mj.height*ZOOM;
  const posX=-(x*ZOOM-SWATCH/2), posY=-(y*ZOOM-SWATCH/2);
  box.innerHTML=`<div class="map-swatch-img" style="width:${SWATCH}px;height:${SWATCH}px;
    background-image:url(${API}/w/${STATE.world}/map.png);
    background-size:${bgW}px ${bgH}px;background-position:${posX}px ${posY}px">
    <div class="map-swatch-pin"></div></div>
    <a class="muted small" href="#/w/${STATE.world}/stats" style="display:block;margin-top:5px">Open full World Map →</a>`;
}
function linkTok(t){ if(!t) return ''; return `<a href="#/w/${STATE.world}/${t.t}/${t.id}" data-type="${t.t}" data-id="${t.id}" data-name="${esc(t.name)}">${esc(properName(t.name))}</a>`; }
const SOURCE_BADGES={
  wordbank:{label:'wordbank text',cls:'badge-wordbank'},
  edited:{label:'edited',cls:'badge-edited'},
  llm:{label:'llm text',cls:'badge-llm'},
};
function sourceBadge(source){
  const b=SOURCE_BADGES[source]||SOURCE_BADGES.wordbank;
  return `<span class="src-badge ${b.cls}">${b.label}</span>`;
}

function entityBody(type,d){
  let h='';
  // character (deterministic flavor text). Leads the page for figures and
  // creatures alike, rendered as wiki-style headings with click-to-collapse,
  // edit, and reroll
  // Wordbank prose now exists for every type, not just figures and creatures
  //. The server builds it for sites, civilizations, artifacts, written
  // works and regions too. This gate was still the old two-type one, which
  // is why those pages kept showing a bare Generate button even after the
  // banks were wired up.
  if(d.flavor && d.flavor.length){
    const heading = LORE_HEADING[type] || 'Account';
    h+=`<div class="section lore-master"><h3>${heading} <button class="lore-toggle" onclick="toggleAllLore(this)">[collapse all]</button></h3>
      <div class="lore-block">`+
      d.flavor.map((c,i)=>`<div class="lore-section" id="sec-${c.key}" data-key="${c.key}" data-etype="${type}" data-eid="${d.id}">
        <h4 class="lore-h">
          <span class="lore-title">${esc(c.label)}</span>
          <span class="lore-controls">
            ${sourceBadge(c.source)}
            <button class="lore-toggle sec-img" onclick="toggleSectionGallery(this,'${jsAttr(c.label)}')" title="Show images attached to this section">&#9635; Images</button>
            <span class="tools-wrap">
              <button class="lore-toggle" onclick="toggleToolsMenu(this)" title="Edit, reroll, regenerate…">Tools &#9662;</button>
              <span class="tools-menu">
                <button onclick="closeToolsMenu();toggleLore(this)">Hide section</button>
                <button onclick="closeToolsMenu();editLoreStart(this)">Edit text</button>
                <button onclick="closeToolsMenu();addGalleryImage('${jsAttr(c.label)}')">Attach an image…</button>
                <button onclick="closeToolsMenu();drawScene(this,'${jsAttr(c.label)}')">Draw this scene…</button>
                <button onclick="closeToolsMenu();randomizeLore(this)">Reroll wording</button>
                <button onclick="closeToolsMenu();regenLore(this)" title="Ask a local AI model to rewrite this (requires a configured provider)">Rewrite with AI</button>
                <button onclick="closeToolsMenu();resetLore(this)">Reset to original</button>
                <button class="danger" onclick="closeToolsMenu();deleteExtraFlavor(this)">Delete section</button>
              </span>
            </span>
          </span>
        </h4>
        <div class="section-gallery" data-label="${jsAttr(c.label)}" hidden></div>
        <div class="lore-text${c.overridden?' overridden':''}${i===0?' has-dropcap':''}">${i===0?dropCap(c.text):esc(c.text)}</div>
      </div>`).join('')+
      `</div><div class="ornament">❧</div></div>`;
  }
  // real notable specimens. Actual named historical figures of this race,
  // linked out to their own pages (not word-bank text)
  if(type==='creature' && d.notable_specimens_h && d.notable_specimens_h.length){
    h+=`<div class="section"><h3>Named Specimens <span class="n">${d.notable_specimens_h.length}</span></h3>
      <ul class="link-list">`+d.notable_specimens_h.filter(s=>s.hf).map(s=>
        `<li>${linkTok(s.hf)}${s.epithet?` <span class="muted small">(${esc(s.epithet)})</span>`:''}${s.events?` <span class="muted small">(${s.events} events)</span>`:''}</li>`).join('')+
      `</ul></div>`;
  }
  // real trade backbone for sites. Kept separate from the generated
  // "Trade & Commerce" narrative category, which now lives in the
  // universal extra_flavor block below alongside every other header
  if(type==='site' && ((d.merchant_companies_h&&d.merchant_companies_h.length)||(d.goods_h&&d.goods_h.length))){
    h+=`<div class="section"><h3>Trade Ledger <span class="badge-real">real</span></h3>`;
    if(d.merchant_companies_h&&d.merchant_companies_h.length){
      h+=`<div class="struct-t">Merchant companies based here</div><ul class="link-list">`+
        d.merchant_companies_h.map(m=>`<li>${linkTok(m)}</li>`).join('')+`</ul>`;
    }
    if(d.goods_h&&d.goods_h.length){
      h+=`<div class="struct-t" style="margin-top:8px">Real named goods recorded here <span class="n">${d.goods_h.length}</span></div><ul class="link-list">`+
        d.goods_h.slice(0,15).map(g=>`<li>${esc(properName(g.name))}${g.material?` <span class="muted small">(${esc(g.material)})</span>`:''}</li>`).join('')+`</ul>`;
    }
    h+=`</div>`;
  }
  // NOTE: this used to render a "Further chronicle" dropdown offering
  // extra, LLM-only topics (Strategic Importance, Cultural Significance,
  // etc.) with no wordbank backing at all. Purely speculative generated
  // text. Removed per explicit request: this app's wordbank-first, no
  // freeform LLM content ethos, discussed at length elsewhere in this
  // project, extends here too. d.extra_flavor may still arrive from the
  // server (harmless, unused). Nothing reads it now.
  // gallery now renders as a floating sidebar panel (see gallerySidebarHtml,
  // called from viewEntity) rather than tucked at the bottom of the page
  // relationships (figures)
  if(type==='hf' && d.relationships_h && d.relationships_h.length){
    h+=`<div class="section"><h3>Relationships <span class="n">${d.relationships_h.length}</span></h3>
      <ul class="rel-list">`+d.relationships_h.map(r=>
        `<li><span class="rt">${esc((r.rel||'').replace(/_/g,' '))}</span>, ${linkTok(r.hf)}${r.year!=null?` <span class="muted small">(yr ${r.year})</span>`:''}</li>`).join('')+`</ul></div>`;
  }
  // affiliations (figures)
  if(type==='hf' && d.entity_links_h && d.entity_links_h.length){
    h+=`<div class="section"><h3>Affiliations</h3><ul class="link-list">`+
      d.entity_links_h.map(l=>`<li><span class="rt">${esc((l.link||'member').replace(/_/g,' '))}</span>, ${linkTok(l.ent)}</li>`).join('')+`</ul></div>`;
  }
  if(type==='hf' && d.site_links_h && d.site_links_h.length){
    h+=`<div class="section"><h3>Associated places</h3><ul class="link-list">`+
      d.site_links_h.map(l=>`<li><span class="rt">${esc((l.link||'').replace(/_/g,' '))}</span>, ${linkTok(l.site)}</li>`).join('')+`</ul></div>`;
  }
  // site structures
  if(type==='site' && d.structures && d.structures.length){
    h+=`<div class="section"><h3>Structures <span class="n">${d.structures.length}</span></h3><div class="structures">`+
      d.structures.map(s=>`<div><span class="struct-t">${esc((s.type||'').replace(/_/g,' '))}</span><br>${esc(s.name||'(unnamed)')}</div>`).join('')+`</div></div>`;
  }
  // entity: positions / owned sites / children
  if(type==='ent'){
    if(d.positions&&d.positions.length)
      h+=`<div class="section"><h3>Positions of authority <span class="n">${d.positions.length}</span></h3><div>`+
        d.positions.map(p=>`<span class="pill">${esc(p.name||'position')}</span>`).join('')+`</div></div>`;
    if(d.owned_sites_h&&d.owned_sites_h.length)
      h+=`<div class="section"><h3>Sites held <span class="n">${d.owned_sites_h.length}</span></h3><ul class="link-list">`+
        d.owned_sites_h.map(s=>`<li>${linkTok(s)}</li>`).join('')+`</ul></div>`;
    if(d.children_h&&d.children_h.length)
      h+=`<div class="section"><h3>Affiliated groups</h3><ul class="link-list">`+
        d.children_h.map(c=>`<li>${linkTok(c)}</li>`).join('')+`</ul></div>`;
    if(d.n_members)
      h+=`<div class="section"><h3>Members <span class="n">${d.n_members.toLocaleString()}</span></h3>
        <div id="memBox"><button class="btn" onclick="loadMembers(${d.id},0)">Show members</button></div></div>`;
  }
  // EVENTS. The heart of every page (creature/bestiary pages are species
  // pages, not individual actors, so they have no event history to show)
  if(type!=='creature'){
    h+= eventsSection('History', d.events_notable, false);
    if(d.events_other && d.events_other.length){
      h+=`<div class="section"><button class="expander" onclick="toggleOther(this)">▸ Show ${d.events_other.length} minor / routine events</button>
        <div class="events" style="display:none">${eventList(d.events_other)}</div></div>`;
    }
  }
  // site collections (wars/attacks that happened here)
  if(type==='site' && d.collections_h && d.collections_h.length){
    h+=`<div class="section"><h3>Notable events here <span class="n">${d.collections_h.length}</span></h3>
      <div class="events"><ul>`+d.collections_h.map(c=>
        `<li><span class="ey">${fmtYear(c.y)}</span> ${renderTokens(c.tokens)}</li>`).join('')+`</ul></div></div>`;
  }
  return h;
}
function eventsSection(title,events,showCat){
  if(!events||!events.length) return `<div class="section"><h3>${title}</h3><div class="muted small">No recorded events.</div></div>`;
  return `<div class="section"><h3>${title} <span class="n">${events.length}</span></h3><div class="events">${eventList(events)}</div></div>`;
}
/* Events render as a compact table rather than a bulleted list. With
   hundreds of rows, a table's fixed year column and alternating stripes make
   the whole thing scannable. A <ul> puts the year at a different horizontal
   position on every line, so the eye has nothing to track down. */
function eventList(events){
  return `<table class="ev-table"><thead><tr><th>Year</th><th>Event</th><th>Kind</th></tr></thead><tbody>`+
    events.map(e=>
      `<tr><td class="ev-y">${fmtYear(e.y)}</td><td>${renderTokens(e.tokens)}</td>`+
      `<td class="ev-cat"><span class="cat">${esc(e.cat)}</span></td></tr>`).join('')+
    `</tbody></table>`;
}
function toggleOther(btn){
  const box=btn.nextElementSibling;
  const open=box.style.display!=='none';
  box.style.display=open?'none':'block';
  btn.textContent=(open?'▸ Show ':'▾ Hide ')+btn.textContent.replace(/^[▸▾] (Show|Hide) /,'');
}
function toggleLore(btn){
  const section=btn.closest('.lore-section');
  const text=section.querySelector('.lore-text');
  const hidden=text.classList.toggle('collapsed');

/* ---- Universal generated headers (sites, civs, artifacts, written works,
   regions). LLM-only, no wordbank baseline. Each category starts as a
   Generate prompt; once generated, gets the same edit/regen controls as
   Character sections, plus a permanent [delete] to drop headers you don't
   want on a given page. ---- */
function extraFlavorSectionHtml(type,eid,c){
  if(!c.text){
    return `<div class="lore-section-empty" data-key="${c.key}" data-etype="${type}" data-eid="${eid}">
      <h4 class="lore-h"><span class="lore-title">${esc(c.label)}</span>
        <span class="lore-controls">
          <button class="lore-toggle" onclick="deleteExtraFlavor(this)" title="Permanently remove this header from this page">[delete]</button>
        </span>
      </h4>
      <button class="btn" onclick="generateExtraFlavor(this)">✨ Generate</button>
    </div>`;
  }
  return `<div class="lore-section" data-key="${c.key}" data-etype="${type}" data-eid="${eid}">
    <h4 class="lore-h">
      <span class="lore-title">${esc(c.label)}</span>
      <span class="lore-controls">
        ${sourceBadge(c.source)}
        <button class="lore-toggle" onclick="addGalleryImage('${jsAttr(c.label)}')" title="Attach an image illustrating this section">[+img]</button>
        <button class="lore-toggle" onclick="editLoreStart(this)">[edit]</button>
        <button class="lore-toggle" onclick="regenLore(this)" title="Ask the local AI model to rewrite this">[regen]</button>
        <button class="lore-toggle" onclick="deleteExtraFlavor(this)" title="Permanently remove this header from this page">[delete]</button>
      </span>
    </h4>
    <div class="lore-text overridden">${esc(c.text)}</div>
  </div>`;
}
async function generateExtraFlavor(btn){
  const section=btn.closest('.lore-section-empty');
  const {key,etype,eid}=section.dataset;
  const original=btn.textContent;
  btn.disabled=true;
  const t0=Date.now();
  const ticker=setInterval(()=>{ btn.textContent=`Generating… ${Math.floor((Date.now()-t0)/1000)}s`; },1000);
  try{
    const r=await fetch(`${API}/flavor_override/${STATE.world}/${etype}/${eid}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'regen',key})});
    const d=await r.json();
    if(!r.ok){ await explainAiFailure(d.error); return; }
    section.outerHTML=extraFlavorSectionHtml(etype,eid,{key,label:section.querySelector('.lore-title').textContent,text:d.text,source:d.source});
    toast('✓ Saved. Badge now reads "llm text"');
  }catch(e){
    await explainAiFailure(e && e.message);
  }finally{
    clearInterval(ticker);
    if(btn){ btn.disabled=false; btn.textContent=original; }
  }
}
async function deleteExtraFlavor(btn){
  const section=btn.closest('.lore-section, .lore-section-empty');
  const {key,etype,eid}=section.dataset;
  const label=section.querySelector('.lore-title').textContent;
  if(!confirm(`Permanently remove the "${label}" header from this page? This can't be undone from here. You'd need to re-add it via the wiki data if you change your mind.`)) return;
  await apiPost(`/flavor_override/${STATE.world}/${etype}/${eid}`,{action:'delete',key});
  section.remove();
}

/* When generation fails, say WHY. The server can see whether Ollama is
   reachable, whether the configured model is installed, and what IS
   installed, so ask it rather than printing a generic guess. */
async function explainAiFailure(serverMsg){
  let d=null;
  try{ d=await api('/ai_status'); }catch(e){}
  const show=(html)=>{ $('#modal').innerHTML=html+
    `<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`;
    openModal(); };
  if(!d){ toast(serverMsg||'AI generation failed, and the status check also failed.'); return; }
  if(!d.reachable){
    show(`<h3>Ollama isn't running</h3>
      <p>DwarfWiki tried <code>${esc(d.host)}</code> and got no answer.</p>
      <p class="hint">Start Ollama (launch the app, or run <code>ollama serve</code>)then try again.</p>
      <p class="hint"><b>This isn't a folder or path problem.</b> DwarfWiki reaches Ollama over
      HTTP on localhost, so where you keep this app on disk has no bearing on it.</p>`);
    return;
  }
  if(d.model_installed===false){
    show(`<h3>That model isn't installed</h3>
      <p>Ollama is running, but has nothing called <code>${esc(d.model)}</code>.</p>
      ${(d.installed_models&&d.installed_models.length)
        ? `<p>It does have: ${d.installed_models.map(m=>`<code>${esc(m)}</code>`).join(', ')}</p>
           <p class="hint">Either pull the expected model, or point DwarfWiki at one of those with
           the <code>DWARFWIKI_MODEL</code> environment variable before launching.</p>`
        : `<p class="hint">No models are installed at all.</p>`}
      <p><code>ollama pull ${esc(d.model)}</code></p>`);
    return;
  }
  show(`<h3>Generation timed out</h3>
    <p>${esc(serverMsg||"The model didn't answer in time.")}</p>
    <p class="hint">Ollama is up and <code>${esc(d.model)}</code> is installed, so this is speed:
    the model is likely running on CPU rather than your GPU, or is large for the memory
    available. A quick test is a smaller model:
    <code>ollama pull llama3.2:3b</code>, then launch with
    <code>DWARFWIKI_MODEL=llama3.2:3b</code>.
    You can also raise <code>DWARFWIKI_AI_TIMEOUT</code> (currently ${d.timeout}s).</p>`);
}

function barSection(title,obj,limit){
  if(!obj||!Object.keys(obj).length) return '';
  const entries=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,limit);
  const max=Math.max(...entries.map(e=>e[1]));
  return `<div class="section"><h3>${title}</h3>`+entries.map(([k,v])=>
    `<div class="bar-row"><span class="bn">${esc(k)}</span><span class="bt"><span class="bf" style="width:${(v/max*100).toFixed(1)}%"></span></span><span class="bv">${v.toLocaleString()}</span></div>`).join('')+`</div>`;
}

  if(!$('#notesBlock')) return;
  let h=`<div class="notes-block"><div class="section"><h3>My notes <span class="n">${notes.length}</span></h3>`;
  if(!notes.length) h+=`<div class="muted small" style="margin-bottom:10px">Your own lore, kept separate from the generated data and saved to disk. Use <code>[[Name]]</code> to link to other pages.</div>`;
  notes.forEach(n=>{
    const cur=n.versions[n.versions.length-1];
    h+=`<div class="note">
      ${n.heading?`<h4>${esc(n.heading)}</h4>`:''}
      <div class="ntext">${wikify(cur.text)}</div>
      ${n.images&&n.images.length?`<div class="note-imgs">${n.images.map(im=>`<img src="/userdata/images/${esc(im)}">`).join('')}</div>`:''}
      <div class="nmeta">
        <span>added ${esc(n.created)}${n.versions.length>1?` · edited ${esc(cur.ts)}`:''}</span>
        <button onclick='editNote(${JSON.stringify(n.id)},${JSON.stringify(n.heading||"")},${JSON.stringify(cur.text)})'>edit</button>
        <button onclick='deleteNote(${JSON.stringify(n.id)})'>delete</button>
      </div>
      ${n.versions.length>1?`<div class="note-history"><details><summary>${n.versions.length-1} earlier version(s)</summary>${n.versions.slice(0,-1).reverse().map(v=>`<div class="ver"><span class="muted">${esc(v.ts)}</span><br>${esc(v.text)}</div>`).join('')}</details></div>`:''}
    </div>`;
  });
  h+=`<button class="add-note-btn" onclick="addNote()"><svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:#fff"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>Add a note</button>`;
  h+=`</div></div>`;
  $('#notesBlock').innerHTML=h;
}
/* [[wiki links]] -> search links */
function wikify(text){
  return esc(text).replace(/\[\[([^\]]+)\]\]/g,(m,name)=>
    `<a class="wikilink" href="#/search/${encodeURIComponent(name.trim())}">${esc(name.trim())}</a>`);
}
function addNote(){ openNoteModal('Add a note','',''); }
function editNote(nid,heading,text){ openNoteModal('Edit note',heading,text,nid); }
function openNoteModal(title,heading,text,nid){
  let uploaded=[];
  $('#modal').innerHTML=`<h3>${title}</h3>
    <label>Heading (optional)</label>
    <input type="text" id="nheading" value="${esc(heading)}" placeholder="e.g. My headcanon, Campaign notes…">
    <label>Note</label>
    <textarea id="ntext" placeholder="Write freely. [[Link to other pages]] with double brackets.">${esc(text)}</textarea>
    <div class="hint">Tip: <code>[[the fierce figure]]</code> becomes a link. Markdown isn't rendered. Plain text with line breaks.</div>
    <label>Images (optional)</label>
    <input type="file" id="nimg" accept="image/*" multiple>
    <div id="nimgprev" class="note-imgs"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="nsave">Save note</button>
    </div>`;
  openModal();
  $('#nimg').addEventListener('change',async function(){
    for(const f of this.files){
      const fd=new FormData(); fd.append('file',f);
      const r=await fetch(API+'/upload',{method:'POST',body:fd});
      if(r.ok){const j=await r.json();uploaded.push(j.filename);
        $('#nimgprev').appendChild(el(`<img src="${j.url}">`));}
    }
  });
  $('#nsave').onclick=async()=>{
    const heading=$('#nheading').value, text=$('#ntext').value;
    const {type,id}=curNoteCtx;
    if(nid){ await apiPost(`/notes/${STATE.world}/${type}/${id}`,{action:'edit',id:nid,heading,text,images:uploaded.length?uploaded:undefined}); }
    else{ await apiPost(`/notes/${STATE.world}/${type}/${id}`,{action:'add',heading,text,images:uploaded}); }
    closeModal(); loadNotes(type,id);
  };
}
async function deleteNote(nid){
  if(!confirm('Delete this note? Earlier versions will be lost too.')) return;
  const {type,id}=curNoteCtx;
  await apiPost(`/notes/${STATE.world}/${type}/${id}`,{action:'delete',id:nid});
  loadNotes(type,id);
}
function openModal(){ $('#modalBg').style.display='flex'; playSfx('modalOpen', 0.45); }
function closeModal(){ $('#modalBg').style.display='none'; playSfx('modalClose', 0.45); }
$('#modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

/* ============================================================
   GLOBAL KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if($('#modalBg').style.display==='flex'){ closeModal(); return; }
    const recent=$('#recentDropdown');
    if(recent && recent.classList.contains('open')){ recent.classList.remove('open'); return; }
    $('#suggest').style.display='none';
    return;
  }
  // '/' focuses search, like most wikis/docs sites, but never steal it
  // while the person is actually typing in another field
  if(e.key==='/' && !e.ctrlKey && !e.metaKey){
    const tag=(document.activeElement&&document.activeElement.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    e.preventDefault();
    $('#search').focus();
    $('#search').select();
  }
});

/* ============================================================
   BACK TO TOP
   ============================================================ */
window.addEventListener('scroll', function(){
  $('#backToTop').classList.toggle('show', window.scrollY > 600);
}, {passive:true});
function scrollToTop(){
  window.scrollTo({top:0, behavior:'smooth'});
  playSfx('place', 0.35);
}


/* ============================================================
   TAGS (inline on entity + browse page)
   ============================================================ */
async function loadTagsInline(type,id,d){
  const tags=d._tags||[];
  const box=el(`<div class="section" id="tagBox" style="border-top:1px solid var(--line);padding-top:10px;margin-top:8px"></div>`);
  renderTagBox(box,type,id,tags);
  const wrap=document.querySelector('.wrap'); // first wrap = factbox/body
  // insert tags right after entity head area
  const notes=$('#notesBlock');
  notes.parentNode.insertBefore(box,notes);
}
function renderTagBox(box,type,id,tags){
  box.innerHTML=`<h3 style="border:none;margin:0 0 6px">Tags</h3>
    <div>${tags.map(t=>`<span class="pill">${esc(t)} <a href="#" onclick="removeTag(event,'${type}',${id},'${jsAttr(t)}')" style="border:none;color:var(--soft)">×</a></span>`).join('')||'<span class="muted small">none yet</span>'}
    <button class="icon-btn" style="margin-left:6px" onclick="addTag('${type}',${id})">+ tag</button></div>`;
}
async function addTag(type,id){
  const t=prompt('Add a tag:'); if(!t) return;
  const d=await apiPost(`/tags/${STATE.world}/${type}/${id}`,{action:'add',tag:t});
  const box=$('#tagBox'); renderTagBox(box,type,id,d.tags);
}
async function removeTag(ev,type,id,tag){
  ev.preventDefault();
  const d=await apiPost(`/tags/${STATE.world}/${type}/${id}`,{action:'remove',tag:tag});
  const box=$('#tagBox'); renderTagBox(box,type,id,d.tags);
}
async function viewTags(){
  $('#view').innerHTML=`<h1 style="margin:0 0 12px">Tags</h1><div class="loading">Loading…</div>`;
  const d=await api('/tags');
  const tags=d.tags||{};
  if(!Object.keys(tags).length){ $('#view').innerHTML=`<h1>Tags</h1><div class="empty">No tags yet. Add tags from any figure, site, artifact or civilization page.</div>`; return; }
  const orphans=Object.values(tags).flat().filter(x=>x.orphan).length;
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h1 style="margin:0">Tags</h1>
      ${orphans?`<button class="btn danger" onclick="pruneOrphans()">Clear ${orphans} orphaned</button>`:''}
    </div>`;
  if(orphans) h+=`<p class="hint" style="margin:6px 0 14px">Entries marked <b>missing world</b> point at
    a world that's no longer installed, so their pages can't open. Clearing removes only those.</p>`;
  Object.entries(tags).forEach(([t,items])=>{
    h+=`<div class="section"><h3>${esc(t)} <span class="n">${items.length}</span></h3><div class="grid">`+
      items.map(it=>`<div class="card${it.orphan?' orphan':''}" data-type="${it.type}">
        <div class="card-body">
          <div class="nm">${it.orphan?esc(properName(it.title)):`<a href="#/w/${it.world}/${it.type}/${it.eid}">${esc(properName(it.title))}</a>`}</div>
          <div class="meta">${TYPE_LABEL[it.type]||it.type} &middot; ${esc(it.world)}
            ${it.orphan?'<span class="orphan-tag">missing world</span>':''}
            <a href="#" onclick="removeTagItem(event,'${esc(it.world)}','${it.type}',${it.eid},'${esc(t).replace(/'/g,"\\'")}')"
               style="border:none;color:var(--soft);float:right">remove</a></div>
        </div></div>`).join('')+`</div></div>`;
  });
  $('#view').innerHTML=h;
}

/* ============================================================
   BOOKMARKS  (folders + context menu)
   ============================================================ */
let BM={folders:[],items:[]};
async function refreshBM(){ BM=await api('/bookmarks'); }
function bookmarkBtn(type,id,d){
  const on=d._bookmarked;
  return `<button class="icon-btn" id="bmBtn" onclick="toggleBookmark('${type}',${id},'${jsAttr(d.name||d.title||'')}','${jsAttr(entitySub(type,d))}')" title="${on?'Remove bookmark':'Bookmark this'}">
    <svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 011 1v18l-7-4-7 4V3a1 1 0 011-1z" ${on?'':'fill="none" stroke="currentColor" stroke-width="2"'}/></svg>${on?'Bookmarked':'Bookmark'}</button>`;
}
function entitySub(type,d){
  if(type==='hf') return [d.race,d.caste||d.sex].filter(Boolean).join(' · ');
  return d.type||d.form||d.material||'';
}
async function toggleBookmark(type,id,title,subtitle){
  await refreshBM();
  const exists=BM.items.find(b=>b.world===STATE.world&&b.type===type&&b.eid===id);
  if(exists){ await apiPost('/bookmarks',{action:'remove',id:exists.id}); }
  else{ await apiPost('/bookmarks',{action:'add',world:STATE.world,type,eid:id,title,subtitle}); }
  await refreshBM();
  const b=$('#bmBtn'); if(b){ const nowOn=!exists;
    b.outerHTML=bookmarkBtnRaw(type,id,title,subtitle,nowOn); }
}
function bookmarkBtnRaw(type,id,title,subtitle,on){
  return `<button class="icon-btn" id="bmBtn" onclick="toggleBookmark('${type}',${id},'${jsAttr(title)}','${jsAttr(subtitle)}')" title="${on?'Remove bookmark':'Bookmark this'}">
    <svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 011 1v18l-7-4-7 4V3a1 1 0 011-1z" ${on?'':'fill="none" stroke="currentColor" stroke-width="2"'}/></svg>${on?'Bookmarked':'Bookmark'}</button>`;
}
async function removeTagItem(ev,world,type,eid,tag){
  ev.preventDefault();
  try{
    await apiPost(`/tags/${world}/${type}/${eid}`,{action:'remove',tag});
    if(window.playSfx) playSfx('sectionClose',0.3);
    viewTags();
  }catch(e){ toast('Could not remove: '+e.message); }
}
/* Bookmarks and tags for a deleted world were unreachable to delete. The
   only way to remove one was to open its page, which is exactly what stopped
   working. This clears those, and only those. */
async function pruneOrphans(){
  if(!confirm('Remove bookmarks, tags, images and custom fields belonging to worlds that are no longer installed?\n\nNothing belonging to a world you still have is touched.')) return;
  try{
    const r=await apiPost('/prune_orphans',{});
    const n=r.removed;
    toast(`Cleared ${n.bookmarks} bookmarks, ${n.tags} tags, ${n.gallery} galleries, ${n.vitals} field sets.`);
    route();
  }catch(e){ toast('Cleanup failed: '+e.message); }
}

async function viewBookmarks(){
  await refreshBM();
  let h=`<div style="display:flex;justify-content:space-between;align-items:center">
    <h1 style="margin:0">Bookmarks</h1>
    <span><button class="btn" onclick="newFolder()">+ New folder</button>
    <button class="btn danger" onclick="pruneOrphans()">Clear orphaned</button></span></div>
    <p class="hint" style="margin:6px 0 14px">"Clear orphaned" removes bookmarks pointing at
      worlds you've since deleted. Their pages can't open, so they can't be removed any other way.</p>`;
  if(!BM.items.length){ h+=`<div class="empty">No bookmarks yet. Open any page and click <b>Bookmark</b>, or right-click any link.</div>`; $('#view').innerHTML=h; return; }
  // group by folder
  const byFolder={none:[]};
  BM.folders.forEach(f=>byFolder[f.id]=[]);
  BM.items.forEach(b=>{ (byFolder[b.folder]||byFolder.none).push(b); });
  // unfiled
  if(byFolder.none.length){
    h+=`<div class="folder-head"><h3>Unfiled</h3></div><div class="grid">`+byFolder.none.map(bmCard).join('')+`</div>`;
  }
  BM.folders.forEach(f=>{
    const items=byFolder[f.id]||[];
    h+=`<div class="folder-head"><h3>📁 ${esc(f.name)} <span class="muted small">(${items.length})</span></h3>
      <span><button class="icon-btn" onclick="renameFolder('${f.id}','${esc(f.name)}')">rename</button>
      <button class="icon-btn" onclick="deleteFolder('${f.id}')">delete</button></span></div>`;
    h+= items.length?`<div class="grid">`+items.map(bmCard).join('')+`</div>`:`<div class="muted small">empty. Move bookmarks here via right-click</div>`;
  });
  $('#view').innerHTML=h;
}
function bmCard(b){
  return `<div class="card" data-type="${b.type}" data-id="${b.eid}" data-name="${esc(b.title)}" data-bm="${b.id}">
    <div class="nm"><a href="#/w/${b.world}/${b.type}/${b.eid}">${esc(properName(b.title))}</a></div>
    <div class="meta">${TYPE_LABEL[b.type]||b.type}${b.subtitle?' · '+esc(b.subtitle):''} · ${esc(b.world)}
      <a href="#" onclick="removeBM(event,'${b.id}')" style="border:none;color:var(--soft);float:right">remove</a></div>
  </div>`;
}
async function removeBM(ev,id){ ev.preventDefault(); await apiPost('/bookmarks',{action:'remove',id}); viewBookmarks(); }
async function newFolder(){ const n=prompt('Folder name:'); if(!n) return; await apiPost('/bookmarks',{action:'add_folder',name:n}); viewBookmarks(); }
async function renameFolder(id,cur){ const n=prompt('Rename folder:',cur); if(!n) return; await apiPost('/bookmarks',{action:'rename_folder',folder_id:id,name:n}); viewBookmarks(); }
async function deleteFolder(id){ if(!confirm('Delete this folder? Bookmarks inside move to Unfiled.')) return; await apiPost('/bookmarks',{action:'remove_folder',folder_id:id}); viewBookmarks(); }

/* ============================================================
   CONTEXT MENU  (right-click on any entity link/card)
   ============================================================ */
document.addEventListener('contextmenu',async e=>{
  const t=e.target.closest('[data-type][data-id]');
  if(!t){ hideCtx(); return; }
  e.preventDefault();
  await refreshBM();
  const type=t.dataset.type, id=parseInt(t.dataset.id), name=t.dataset.name||'';
  const isBm=BM.items.find(b=>b.world===STATE.world&&b.type===type&&b.eid===id);
  const link=`${location.origin}/#/w/${STATE.world}/${type}/${id}`;
  const folders=BM.folders.map(f=>`<div class="ci" onclick="ctxMove('${type}',${id},'${jsAttr(name)}','${f.id}')">📁 ${esc(f.name)}</div>`).join('')||`<div class="ci muted">no folders yet</div>`;
  $('#ctx').innerHTML=`
    <div class="ci" onclick="go('#/w/${STATE.world}/${type}/${id}');hideCtx()"><svg viewBox="0 0 24 24"><path d="M10 6v2H5v11h11v-5h2v6a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1zM21 3v7h-2V6.4l-8.8 8.8-1.4-1.4L17.6 5H14V3z"/></svg>Open page</div>
    <div class="sep"></div>
    <div class="ci" onclick="ctxBookmark('${type}',${id},'${jsAttr(name)}','${jsAttr(ctxSub(t))}')"><svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 011 1v18l-7-4-7 4V3a1 1 0 011-1z"/></svg>${isBm?'Remove bookmark':'Bookmark'}</div>
    <div class="ci sub"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8z"/></svg>Move to folder ▸
      <div class="submenu">${folders}</div></div>
    <div class="ci" onclick="ctxTag('${type}',${id})"><svg viewBox="0 0 24 24"><path d="M21 11l-9-9H4a2 2 0 00-2 2v8l9 9zM6.5 8A1.5 1.5 0 116.5 5a1.5 1.5 0 010 3z"/></svg>Add tag…</div>
    <div class="sep"></div>
    <div class="ci" onclick="ctxCopy('${esc(link)}')"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 00-2 2v14h2V3h12zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11z"/></svg>Copy link</div>
    <div class="ci" onclick="ctxPrint('${type}',${id})"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6h1a3 3 0 013 3v5h-4v3H7v-3H3v-5a3 3 0 013-3z"/></svg>Open &amp; print</div>`;
  const x=Math.min(e.clientX,window.innerWidth-210), y=Math.min(e.clientY,window.innerHeight-260);
  $('#ctx').style.left=x+'px'; $('#ctx').style.top=y+'px'; $('#ctx').style.display='block';
});
document.addEventListener('click',hideCtx);
function hideCtx(){ $('#ctx').style.display='none'; }
function ctxSub(t){ return t.dataset.sub||''; }
async function ctxBookmark(type,id,name,sub){
  const exists=BM.items.find(b=>b.world===STATE.world&&b.type===type&&b.eid===id);
  if(exists) await apiPost('/bookmarks',{action:'remove',id:exists.id});
  else await apiPost('/bookmarks',{action:'add',world:STATE.world,type,eid:id,title:name,subtitle:sub});
  hideCtx();
}
async function ctxMove(type,id,name,folder){
  await refreshBM();
  let b=BM.items.find(x=>x.world===STATE.world&&x.type===type&&x.eid===id);
  if(!b){ await apiPost('/bookmarks',{action:'add',world:STATE.world,type,eid:id,title:name}); await refreshBM();
    b=BM.items.find(x=>x.world===STATE.world&&x.type===type&&x.eid===id); }
  await apiPost('/bookmarks',{action:'move',id:b.id,folder}); hideCtx();
  if(location.hash.includes('bookmarks')) viewBookmarks();
}
async function ctxTag(type,id){ hideCtx(); const t=prompt('Add a tag:'); if(!t) return;
  await apiPost(`/tags/${STATE.world}/${type}/${id}`,{action:'add',tag:t}); }
function ctxCopy(link){ hideCtx(); navigator.clipboard?.writeText(link).then(()=>toast('Link copied')); }
function ctxPrint(type,id){ hideCtx(); location.hash=`#/w/${STATE.world}/${type}/${id}`;
  setTimeout(()=>window.print(),700); }

/* ============================================================
   MISC
   ============================================================ */
async function doExport(){ toast('Preparing backup…'); window.location=API+'/export'; }
function togglePrintImages(hide){
  document.body.classList.toggle('print-no-images', hide);
  localStorage_set('printNoImages', hide?'1':'0');
}
function initPrintToggle(){
  const on=localStorage_get('printNoImages')==='1';
  $('#printNoImages').checked=on;
  document.body.classList.toggle('print-no-images', on);
}
function toast(msg){
  const t=el(`<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#241f18;color:#f4efe4;padding:10px 20px;border-radius:20px;z-index:400;font-family:var(--sans);font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)">${esc(msg)}</div>`);
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}

boot();
