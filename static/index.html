<main><div id="view"><div class="loading">Loading…</div></div></main>

<!-- context menu -->
<div id="ctx"></div>
<!-- modal -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="versionTag"></div>
<button id="backToTop" onclick="scrollToTop()" title="Back to top">↑</button>

<script>
/* ============================================================
   DwarfWiki front-end  (vanilla JS SPA)
   ============================================================ */
const API = "/api";

/* ============================================================
   ACCENT COLOR POOL. One picked per page load (not mid-session,
   that would be jarring), applied before first paint so there's
   no flash of the default color.
   ============================================================ */
const CUSTOM_THEMES=['sepia','forest','amber','storm','magma','ichor','miasma','regalia','frostbite'];
const ACCENT_POOL=[
  "#7a2e2e","#8a3a1f","#6b3fa0","#1f6b52","#2e5a8a","#a04b7a","#4a6b1f","#8a5a1f",
  "#3f2e8a","#8a1f4a","#1f8a6b","#6b1f8a","#8a6b1f","#1f4a8a","#8a2e5a","#2e8a4a",
  "#5a1f8a","#8a4a1f","#1f6b8a","#7a1f2e","#4a8a1f","#8a1f6b","#1f8a3f","#6b4a1f",
  "#2e1f8a","#8a3f1f","#1f8a8a","#5a2e8a","#8a5a4a","#2e6b1f","#8a1f1f","#1f5a8a",
];
function _lighten(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,((n>>16)&255)+amt), g=Math.min(255,((n>>8)&255)+amt), b=Math.min(255,(n&255)+amt);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
(function applyRandomAccent(){
  const c=ACCENT_POOL[Math.floor(Math.random()*ACCENT_POOL.length)];
  const root=document.documentElement.style;
  root.setProperty('--accent',c);
  root.setProperty('--link',c);
  root.setProperty('--link-hover',_lighten(c,35));
})();
(function applyDarkModeEarly(){
  try{
    let t=localStorage.getItem('theme');
    if(!t){ t = localStorage.getItem('darkMode')==='1' ? 'dark' : 'light'; }
    applyThemeClasses(t);
  }catch(e){}
})();
function applyThemeClasses(t){
  const b=document.body.classList;
  const allClasses=['dark-mode','hc-mode'];
  CUSTOM_THEMES.forEach(n=>{ allClasses.push(n+'-mode', n+'-dark-mode'); });
  b.remove(...allClasses);
  if(t==='dark') b.add('dark-mode');
  else if(t==='hc-light') b.add('hc-mode');
  else if(t==='hc-dark') b.add('dark-mode','hc-mode');
  else{
    const isDark = t.endsWith('-dark');
    const base = isDark ? t.slice(0,-5) : t;
    if(CUSTOM_THEMES.includes(base)) b.add(base+(isDark?'-dark-mode':'-mode'));
  }
}
let STATE = {world:null, worlds:[], meta:null};

/* ============================================================
   SOUND EFFECTS. Page turns on navigation, a click on every
   internal link, a book opening/closing when you expand or
   collapse a section. Muted state persists like dark mode does.
   ============================================================ */
const SFX = {
  pageTurn: ['bookFlip1.ogg','bookFlip2.ogg','bookFlip3.ogg'],
  linkClick: ['click2.ogg','click3.ogg'],
  sectionOpen: ['bookOpen.ogg'],
  sectionClose: ['bookClose.ogg'],
  modalOpen: ['bookOpen.ogg'],
  modalClose: ['bookClose.ogg'],
  place: ['bookPlace1.ogg'],
  toggle: ['switch1.ogg'],
};
let sfxMuted = false;
(function initSfxMuted(){
  try{ sfxMuted = localStorage.getItem('sfxMuted')==='1'; }catch(e){}
})();
function playSfx(key, volume){
  if(sfxMuted) return;
  const list = SFX[key];
  if(!list || !list.length) return;
  const file = list[Math.floor(Math.random()*list.length)];
  try{
    const a = new Audio('/audio/'+file);
    a.volume = volume!=null ? volume : 0.45;
    a.play().catch(()=>{});   // browsers can reject .play() before the first real click. Harmless, just skip that one
  }catch(e){ /* sound is a nice-to-have, never let it break the page */ }
}
function toggleSfxMuted(){
  sfxMuted = !sfxMuted;
  try{ localStorage.setItem('sfxMuted', sfxMuted?'1':'0'); }catch(e){}
  const sb=$('#sfxBtn');   // the standalone button is gone; sound lives in Settings now
  if(sb){
    sb.classList.toggle('muted', sfxMuted);
    sb.title = sfxMuted ? 'Sounds off (click to enable)' : 'Toggle page sounds';
  }
  if(!sfxMuted) playSfx('toggle');
}
(function applySfxMutedEarly(){
  document.addEventListener('DOMContentLoaded', ()=>{
    const btn=$('#sfxBtn'); if(!btn) return;
    if(btn){ btn.classList.toggle('muted', sfxMuted); btn.title = sfxMuted ? 'Sounds off (click to enable)' : 'Toggle page sounds'; }
  });
})();

/* ---------- tiny helpers ---------- */
const $ = s=>document.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const esc = s=> (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Legends names come out of the raw XML fully lowercase (DF only title-cases
   them at render time in-game), so every page showed "the belch of factions"
   instead of "The Belch of Factions". This mirrors that in-game convention:
   capitalize every word except small connector words, unless they lead. */
const TITLE_SMALL_WORDS = new Set(['a','an','and','as','at','but','by','for','in','nor','of','on','or','the','to','with']);
function properName(s){
  if(s==null) return '';
  const str=String(s);
  if(!str) return str;
  return str.split(' ').map((w,i)=>{
    if(!w) return w;
    const lw=w.toLowerCase();
    if(i>0 && TITLE_SMALL_WORDS.has(lw)) return lw;
    return w.split('-').map(part=>part?part.charAt(0).toUpperCase()+part.slice(1).toLowerCase():part).join('-');
  }).join(' ');
}
/* safe to embed inside  onclick="fn('...')". JS-escape then HTML-escape */
function jsAttr(x){x=String(x==null?'':x);x=x.replace(/\\/g,'\\\\').replace(/'/g,"\\'");return x.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
/* Every request gets a ceiling. Nothing in the app had one, so a stalled
   call left a "Loading…" spinner on screen permanently, which is what an
   "infinite load" actually is. The first request against a world has to
   parse the whole legends dump (10s+ on a large one), so the limit is
   generous and the wait is explained rather than silent. */
const API_TIMEOUT_MS = 90000;
let _slowTimer=null;
function _noteSlow(path){
  clearTimeout(_slowTimer);
  _slowTimer=setTimeout(()=>{
    const l=document.querySelector('#view .loading');
    if(l) l.innerHTML='Loading…<div class="hint" style="margin-top:8px">'+
      'First visit to a world reads its whole legends export. This can take '+
      'a while on a large one; it is cached afterwards.</div>';
  },2500);
}
async function api(path){
  _noteSlow(path);
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(), API_TIMEOUT_MS);
  try{
    const r=await fetch(API+path,{signal:ctl.signal});
    if(!r.ok) throw new Error(await r.text());
    return await r.json();
  }catch(e){
    if(e.name==='AbortError')
      throw new Error(`The server didn't answer within ${API_TIMEOUT_MS/1000}s (${path}). It may still be parsing a world. Try again in a moment.`);
    throw e;
  }finally{ clearTimeout(t); clearTimeout(_slowTimer); }
}
async function apiPost(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json();}
function go(hash){ if(location.hash===hash) route(); else location.hash=hash; }
const TYPE_LABEL={hf:'Figure',site:'Site',artifact:'Artifact',ent:'Civilization',wc:'Written Work',region:'Region',creature:'Creature'};
/* What the wordbank section is called on each kind of page. */
const LORE_HEADING={hf:'Character',creature:'Natural History',site:'Details',
  ent:'Details',artifact:'Details',wc:'Details',region:'The Country'};
const TYPE_PLURAL={hf:'Figures',site:'Sites',artifact:'Artifacts',ent:'Civilizations',wc:'Written Works',region:'Regions',creature:'Bestiary'};
const fmtYear=y=>(y==null||y===-1)?'-':y;

/* ---------- render tokens (strings + link objects) ---------- */
function renderTokens(tokens){
  if(!tokens) return '';
  return tokens.map(t=>{
    if(typeof t==='string') return esc(t);
    return `<a href="#/w/${STATE.world}/${t.t}/${t.id}" data-type="${t.t}" data-id="${t.id}" data-name="${esc(t.name)}">${esc(properName(t.name))}</a>`;
  }).join('');
}

/* ============================================================
   ROUTER
   ============================================================ */
let _hasNavigatedOnce = false;
async function route(){
  const h=location.hash.slice(1)||'/';
  const parts=h.split('/').filter(x=>x!=='');
  // leaving the map: stop its animation loop and resize listener rather than
  // leaving them running against a canvas that's no longer in the document
  const onMapRoute=/^\/w\/[^/]+\/(map|wall)$/.test(h);
  if(!onMapRoute){
    document.body.classList.remove('map-mode');
    if(window.MapView) MapView.unmount();
    if(window.WallView) WallView.unmount();
  }
  setActiveTab(h);
  if(_hasNavigatedOnce) playSfx('pageTurn', 0.4); else _hasNavigatedOnce=true;
  try{
    if(h==='/'||parts.length===0){ return viewAtlas(); }
    if(parts[0]==='shelf'){ return viewShelf(); }
    if(parts[0]==='w'){
      const world=parts[1];
      if(world!==STATE.world) await switchWorld(world,true);
      const kind=parts[2];
      if(kind==='home') return viewWorldHome();
      if(kind==='browse') return viewBrowse(parts[3]);
      if(kind==='timeline') return viewTimeline();
      if(kind==='stats') return viewStats();
      if(kind==='map') return viewMap();
      if(kind==='wall') return viewWall();
      if(kind==='adventurers') return viewAdventurers();
      if(kind==='tools' && parts[3]==='calendar') return viewCalendarStandalone();
      if(kind==='update') return viewUpdateWorld(world);
      if(['hf','site','artifact','ent','wc','region','creature'].includes(kind))
        return viewEntity(kind, parts[3]);
    }
    if(parts[0]==='search') return viewSearch(decodeURIComponent(parts[1]||''));
    if(parts[0]==='bookmarks') return viewBookmarks();
    if(parts[0]==='prompts') return viewPrompts();
    if(parts[0]==='imagestyle') return viewImageStyle();
    if(parts[0]==='tags') return viewTags();
    if(parts[0]==='fortress') return viewFortress();
    if(parts[0]==='tools' && parts[1]==='dice') return viewToolsStandalone();
    viewAtlas();
  }catch(e){ $('#view').innerHTML=`<div class="empty">Something went wrong: ${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange',route);

/* ============================================================
   COLLAPSIBLE SECTIONS. Every .section's <h3> header becomes
   a real toggle, applied universally via delegation rather than
   touching every render function that builds a .section block.
   Clicks on an interactive element already inside the header
   (a button, link, or the little count badge) do their own thing
   and don't also toggle the section.
   ============================================================ */
document.addEventListener('click', function(e){
  const h3 = e.target.closest('.section > h3');
  if(!h3) return;
  if(e.target.closest('button, a')) return;   // let inner controls (collapse-all, shuffle, etc.) handle themselves
  const section = h3.parentElement;
  const collapsing = !section.classList.contains('collapsed');
  section.classList.toggle('collapsed');
  playSfx(collapsing ? 'sectionClose' : 'sectionOpen', 0.4);
});

/* ============================================================
   LINK CLICK SOUND. Delegated so it covers every internal link
   the app generates (renderTokens output, nav tabs, browse grids,
   search results, etc.) without touching each render function.
   Skips modified clicks (new-tab/window) since those aren't
   really "turning the page" here.
   ============================================================ */
document.addEventListener('click', function(e){
  if(e.button!==0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  playSfx('linkClick', 0.35);
});


function setActiveTab(h){
  document.querySelectorAll('nav.tabs a').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('href')===h ||
      (!!a.dataset.t && h.includes('/browse/'+a.dataset.t)) );
  });
  // a link inside a dropdown can't show you where you are. The collapsed
  // trigger is the only part on screen, so bubble the state up to it
  document.querySelectorAll('.tabdrop').forEach(d=>{
    const hit = !!d.querySelector('.tabdrop-menu a.active');
    d.classList.toggle('here', hit);
    const trig = d.querySelector(':scope > a');
    if(trig) trig.classList.toggle('active', hit);
  });
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function boot(){
  const d=await api('/worlds');
  STATE.worlds=d.worlds;
  const sel=$('#worldSel'); sel.innerHTML='';
  d.worlds.forEach(w=>{
    sel.appendChild(el(`<option value="${w.name}">${esc(w.world_name)}</option>`));
  });
  if(d.pending && d.pending.length){
    d.pending.forEach(p=>sel.appendChild(el(`<option disabled>${esc(p)}. Importing…</option>`)));
  }
  // pick world: last used or first
  const last=localStorage_get('lastWorld');
  STATE.world = (d.worlds.find(w=>w.name===last)||d.worlds[0]||{}).name;
  if(STATE.world){ sel.value=STATE.world; await loadMeta(); }
  buildTabs();
  route();
  initPrintToggle();
  api('/version').then(v=>{ $('#versionTag').textContent=`Dwarfipedia v${v.version}`; }).catch(()=>{});
}
async function loadMeta(){ STATE.meta=await api(`/w/${STATE.world}/meta`); }
async function switchWorld(name, silent){
  STATE.world=name; localStorage_set('lastWorld',name);
  localStorage_set('visit_'+name, String(Date.now()));
  $('#worldSel').value=name;
  await loadMeta(); buildTabs();
  if(!silent) go(`#/w/${name}/home`);
}
/* localStorage is unavailable in some embeds; guard it */
function localStorage_get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function localStorage_set(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ============================================================
   DARK MODE
   ============================================================ */
function setTheme(t){
  applyThemeClasses(t);
  try{ localStorage.setItem('theme', t); localStorage.removeItem('darkMode'); }catch(e){}
}

/* ============================================================
   RECENTLY VIEWED. Lives only as a nav dropdown, not on any page body
   ============================================================ */
const RECENT_KEY='dw_recently_viewed';
function recordRecentlyViewed(type,id,name){
  let list=[];
  try{ list=JSON.parse(localStorage_get(RECENT_KEY)||'[]'); }catch(e){}
  list=list.filter(it=>!(it.world===STATE.world&&it.type===type&&it.id===id));
  list.unshift({world:STATE.world,worldName:STATE.meta.world_name||STATE.world,type,id,name,ts:Date.now()});
  localStorage_set(RECENT_KEY, JSON.stringify(list.slice(0,20)));
}
function toggleRecentDropdown(ev){
  ev.stopPropagation();
  const el=$('#recentDropdown');
  const opening=!el.classList.contains('open');
  el.classList.toggle('open',opening);
  if(opening) renderRecentDropdown();
}
function renderRecentDropdown(){
  let list=[];
  try{ list=JSON.parse(localStorage_get(RECENT_KEY)||'[]'); }catch(e){}
  const el=$('#recentDropdown');
  if(!list.length){ el.innerHTML=`<div class="rd-empty">Pages you visit will show up here.</div>`; return; }
  el.innerHTML=list.map(it=>`<a class="rd-item" href="#/w/${it.world}/${it.type}/${it.id}" onclick="$('#recentDropdown').classList.remove('open')">
    <div class="rd-type">${TYPE_LABEL[it.type]||it.type} · ${esc(it.worldName)}</div>
    <div>${esc(properName(it.name))}</div>
  </a>`).join('');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.recent-wrap')) $('#recentDropdown')?.classList.remove('open');
});

function buildTabs(){
  if(!STATE.world){ $('#tabs').innerHTML=`<a href="#/">Atlas</a>`; return; }
  const w=STATE.world;
  /* Twelve flat links was a lot of bar. The six browse categories are one
     "Browse" menu now, and the two reference screens are one "Records"
     menu, which leaves a short top row of the things you actually jump
     between. Every destination is still one hover away. */
  const drop=(id,label,items)=>`<span class="tabdrop" data-drop="${id}">
      <a href="#" onclick="return toggleDrop(event,'${id}')">${label}<i class="caret"></i></a>
      <span class="tabdrop-menu">${items.map(([h,l,sub,dt])=>
        `<a href="${h}"${dt?` data-t="${dt}"`:''}>${l}${sub?`<small>${sub}</small>`:''}</a>`).join('')}</span>
    </span>`;

  const links = [
    `<a href="#/">Atlas</a>`,
    `<a href="#/w/${w}/home">Home</a>`,
    drop('browse','Browse',[
      [`#/w/${w}/browse/hf`,'Figures','everyone who ever lived here','hf'],
      [`#/w/${w}/browse/site`,'Sites','towns, fortresses, ruins','site'],
      [`#/w/${w}/browse/ent`,'Civilizations','peoples and groups','ent'],
      [`#/w/${w}/browse/artifact`,'Artifacts','named objects','artifact'],
      [`#/w/${w}/browse/wc`,'Written works','books, poems, scrolls','wc'],
      [`#/w/${w}/browse/creature`,'Bestiary','beasts and races','creature'],
    ]),
    drop('carto','Cartography',[
      [`#/w/${w}/map`,'Region map','one world, with layers and tools'],
      [`#/w/${w}/wall`,'Continent map','many worlds on one wall'],
    ]),
    drop('gametools','Game Tools',[
      [`#/w/${w}/adventurers`,'Adventurer Guide','character sheet &amp; tracker'],
      [`#/fortress`,'Fortress Guide','DFHack dashboard'],
      [`#/tools/dice`,'Dice &amp; Calculator','standalone tools page'],
      [`#/w/${w}/tools/calendar`,'Calendar','events by day, this world'],
    ]),
    drop('records','Records',[
      [`#/w/${w}/timeline`,'Timeline','the world year by year'],
      [`#/w/${w}/stats`,'World stats','census and charts'],
      [`#/w/${w}/update`,'Update world','load a newer legends export'],
      ['#/bookmarks','Bookmarks','pages you have flagged'],
      ['#/tags','Tags','your own labels'],
    ]),
  ];
  $('#tabs').innerHTML=links.join('');
}
function toggleDrop(ev,id){
  ev.preventDefault(); ev.stopPropagation();
  const me=document.querySelector(`.tabdrop[data-drop="${id}"]`);
  const wasOpen=me && me.classList.contains('open');
  document.querySelectorAll('.tabdrop.open').forEach(d=>d.classList.remove('open'));
  if(me && !wasOpen){ me.classList.add('open'); if(window.playSfx) playSfx('uiClick',0.28); }
  return false;
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.tabdrop'))
    document.querySelectorAll('.tabdrop.open').forEach(d=>d.classList.remove('open'));
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') document.querySelectorAll('.tabdrop.open').forEach(d=>d.classList.remove('open'));
});

/* ============================================================
   ATLAS  (multi-world landing / cover page)
   ============================================================ */
async function viewAtlas(){
  $('#view').innerHTML=`<div class="loading">Opening the atlas…</div>`;
  const d=await api('/worlds');

  if(!d.worlds.length && !(d.pending&&d.pending.length)){
    let html=`<div class="atlas-hero google-hero"><h1>The Atlas</h1>
      <div class="atlas-search-row"><input type="text" id="atlasSearch" placeholder="Search figures, sites, artifacts, civilizations…" onkeydown="if(event.key==='Enter')atlasSearchGo()"></div>
      <div class="atlas-search-btns"><button class="btn" onclick="atlasSearchGo()">Search</button><button class="btn" onclick="atlasRandomGo()">🎲 Random</button></div>
    </div>`;
    html+=`<div class="empty" style="text-align:left;max-width:520px;margin:20px auto">
      <div style="text-align:center;margin-bottom:14px">No worlds imported yet. Add your first one below.</div>
      ${addWorldFormHtml('First')}
    </div>`;
    $('#view').innerHTML=html; return;
  }

  // sort by most-recently-visited (this browser); never-visited worlds fall
  // back to slot order at the end
  const worlds=[...d.worlds].sort((a,b)=>{
    const va=parseInt(localStorage_get('visit_'+a.name)||'0',10);
    const vb=parseInt(localStorage_get('visit_'+b.name)||'0',10);
    if(va||vb) return vb-va;
    return (a.slot||0)-(b.slot||0);
  });
  const heroWorld=worlds[0];

  // Google-style: the map IS the logo. No tagline here, that spirit of
  // writing lives on each world's Home page instead, kept simple here.
  let html=`<div class="atlas-hero google-hero">
    <h1 class="atlas-wordmark">The Atlas</h1>

/* ============================================================
   ADD WORLD. A real upload form (name + the two legends XML
   files), replacing the old "copy files by hand and restart"
   instructions. Used both in the persistent "Add a world" card
   and the very-first-run empty state.
   ============================================================ */
let _importPollTimer=null;
function addWorldFormHtml(idSuffix){
  const s=idSuffix||'';
  return `<div class="add-world-form" onclick="event.stopPropagation()">
    <div class="hint" style="margin-bottom:8px">Export <b>legends</b> and <b>legends_plus</b> XML from Dwarf Fortress (Legends Mode → Export), then pick both files here.</div>
    <input type="text" id="awName${s}" placeholder="World name (e.g. Lathonkar)" style="width:100%;margin-bottom:8px">
    <label class="hint" style="display:block;margin-bottom:2px">legends.xml</label>
    <input type="file" id="awBase${s}" accept=".xml" style="width:100%;margin-bottom:8px">
    <label class="hint" style="display:block;margin-bottom:2px">legends_plus.xml</label>
    <input type="file" id="awPlus${s}" accept=".xml" style="width:100%;margin-bottom:8px">
    <button class="btn primary" onclick="submitWorldImport('${s}')">Import world</button>
    <div id="awStatus${s}" class="hint" style="margin-top:8px"></div>
  </div>`;
}
async function submitWorldImport(idSuffix){
  const s=idSuffix||'';
  const name=$('#awName'+s).value.trim();
  const base=$('#awBase'+s).files[0];
  const plus=$('#awPlus'+s).files[0];
  const status=$('#awStatus'+s);
  if(!name){ status.textContent='Give the world a name first.'; return; }
  if(!base||!plus){ status.textContent='Both legends.xml and legends_plus.xml are required.'; return; }
  const fd=new FormData();
  fd.append('name',name); fd.append('base',base); fd.append('plus',plus);
  status.textContent='Uploading…';
  let r;
  try{ r=await fetch(API+'/import_world',{method:'POST',body:fd}); }
  catch(e){ status.textContent='Upload failed: '+e.message; return; }
  if(!r.ok){ status.textContent='Import failed: '+(await r.text()); return; }
  const j=await r.json();
  status.textContent='Importing world data, this can take about 30 seconds for a large history…';
  playSfx('place',0.4);
  if(_importPollTimer) clearInterval(_importPollTimer);
  _importPollTimer=setInterval(async()=>{
    let st;
    try{ st=await api('/reimport_status/'+j.slug); }catch(e){ return; }
    if(st.status==='done'){
      clearInterval(_importPollTimer);
      status.textContent='Done! Opening '+name+'…';
      playSfx('modalOpen',0.45);
      setTimeout(()=>{ go('#/w/'+j.slug+'/home'); location.reload(); }, 500);
    }else if(st.status && st.status.startsWith('error')){
      clearInterval(_importPollTimer);
      status.textContent=st.status;
    }
  },1500);
}


/* ============================================================

   The heavy lifting lives in map.js under window.MapView; this
   just injects its markup and hands over.

/* The map and wall need a real height. They get it from measuring their own
   offset from the top of the viewport, which is more robust than a calc()
   against a sticky header whose tab row wraps on narrow windows. */
function sizeMapView(){
  const mv=document.getElementById('mapView')||document.getElementById('wallView');
  if(!mv) return;
  mv.style.height='auto';
  const top=mv.getBoundingClientRect().top;
  const h=Math.max(380, Math.floor(window.innerHeight-top-6));
  mv.style.height=h+'px';
  if(window.MapView && MapView.resize) MapView.resize();
  if(window.WallView && WallView.resize) WallView.resize();
}
window.addEventListener('resize', sizeMapView);

/* ============================================================
   THE BOOK READER
   DF records that a work exists and roughly what it's about, but
   never a word of its text. This is where the text you write for
   it lives. Paged, so a long work reads like a book rather than
   one endless scroll.
   ============================================================ */
let BOOK={pages:[],title:''}, BOOKPAGE=0, BOOKEDIT=false;
async function openBook(){
  const d=STATE.entity; if(!d) return;
  try{ BOOK=await api(`/book/${STATE.world}/${d._etype}/${d.id}`); }
  catch(e){ BOOK={pages:[],title:''}; }
  BOOK.pages=BOOK.pages||[]; BOOKPAGE=0; BOOKEDIT=!BOOK.pages.length;
  renderBook();
}
function renderBook(){
  const d=STATE.entity;
  const n=BOOK.pages.length;
  const title=BOOK.title||d.name||d.title||'Untitled';
  let body;
  if(BOOKEDIT){
    body=`<div class="bk-edit">
      <label class="as-lab">Title as written inside</label>
      <input id="bkTitle" value="${esc(BOOK.title||'')}" placeholder="${esc(d.name||d.title||'')}">
      <label class="as-lab">Page ${n?BOOKPAGE+1:1}${n?` of ${n}`:''}</label>
      <textarea id="bkText" rows="16" placeholder="Paste or write this page's text.">${esc(BOOK.pages[BOOKPAGE]||'')}</textarea>
      <div class="bk-editacts">
        <button class="btn primary" onclick="bookSavePage()">Save page</button>
        <button class="btn" onclick="bookAddPage()">+ New page after this</button>
        ${n?`<button class="btn danger" onclick="bookRemovePage()">Delete this page</button>`:''}
        ${n?`<button class="btn" onclick="BOOKEDIT=false;renderBook()">Done editing</button>`:''}
      </div>
      <div class="hint" style="margin-top:8px">Pages are yours. Kept in userdata, never touched by
        a world re-import. Paste as many as the work needs.</div>
    </div>`;
  }else if(!n){
    body=`<div class="bk-empty">Nothing written in it yet.
      <button class="btn primary" onclick="BOOKEDIT=true;renderBook()">Write its contents</button></div>`;
  }else{
    body=`<div class="bk-page">${esc(BOOK.pages[BOOKPAGE]||'').replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>').replace(/^/,'<p>')+'</p>'}</div>
      <div class="bk-nav">
        <button class="btn" ${BOOKPAGE===0?'disabled':''} onclick="bookTurn(-1)">&larr; Previous</button>
        <span class="bk-count">Page ${BOOKPAGE+1} of ${n}</span>
        <button class="btn" ${BOOKPAGE>=n-1?'disabled':''} onclick="bookTurn(1)">Next &rarr;</button>
      </div>`;
  }
  $('#modal').innerHTML=`<div class="bk">
      <div class="bk-head"><h3>${esc(title)}</h3>
        ${!BOOKEDIT&&n?`<button class="lore-toggle" onclick="BOOKEDIT=true;renderBook()">edit</button>`:''}</div>
      ${body}
      <div class="modal-actions"><button class="btn" onclick="closeModal();route()">Close</button></div>
    </div>`;
  $('#modal').classList.add('modal-book');
  openModal();
}
function bookTurn(dir){
  const n=BOOK.pages.length;
  BOOKPAGE=Math.max(0,Math.min(n-1,BOOKPAGE+dir));
  if(window.playSfx) playSfx('pageTurn',0.45);
  renderBook();
}
async function bookPost(body){
  const d=STATE.entity;
  BOOK=await apiPost(`/book/${STATE.world}/${d._etype}/${d.id}`,body);
  BOOK.pages=BOOK.pages||[];
}
async function bookSavePage(){
  const t=document.getElementById('bkText'), ti=document.getElementById('bkTitle');
  const pages=BOOK.pages.slice();
  if(!pages.length) pages.push(t.value); else pages[BOOKPAGE]=t.value;
  await bookPost({action:'save', title:ti?ti.value:BOOK.title, pages});
  if(window.playSfx) playSfx('sectionOpen',0.35);
  toast('Saved.');
  renderBook();
}
async function bookAddPage(){
  const t=document.getElementById('bkText'), ti=document.getElementById('bkTitle');
  const pages=BOOK.pages.slice();
  if(!pages.length) pages.push(t?t.value:''); else pages[BOOKPAGE]=t.value;
  pages.splice(BOOKPAGE+1,0,'');
  await bookPost({action:'save', title:ti?ti.value:BOOK.title, pages});
  BOOKPAGE=Math.min(BOOKPAGE+1,BOOK.pages.length-1);
  if(window.playSfx) playSfx('pageTurn',0.4);
  renderBook();
}
async function bookRemovePage(){
  if(!confirm('Delete this page?')) return;
  await bookPost({action:'remove_page', index:BOOKPAGE});
  BOOKPAGE=Math.max(0,Math.min(BOOKPAGE,BOOK.pages.length-1));
  if(!BOOK.pages.length) BOOKEDIT=true;
  renderBook();
}

/* Image style settings. Same shape as the text prompt editor. */
let IMGCFG=null;
async function viewImageStyle(){

}
function renderImageStyle(st){
  const c=IMGCFG;
  $('#view').innerHTML=`
    <div class="crumbs">Settings &rsaquo; Image style</div>
    <h1 style="margin:0 0 4px">Image style</h1>
    <p class="lead-para">How generated pictures are drawn. Everything runs on your own

    ${st ? `<div class="upd-box" style="margin-bottom:22px">
      <b>${st.reachable?'Image server connected':'No image server found'}</b>
      <div class="hint">${esc(st.advice||'')}</div>
      ${st.models&&st.models.length?`<div class="hint">Models: ${st.models.map(m=>`<code>${esc(m)}</code>`).join(', ')}</div>`:''}
    </div>`:''}
    <div class="pr-sec">
      <div class="sec-head"><h3>Style</h3>
        <button class="lore-toggle" onclick="imgReset('style')">reset</button></div>
      <div class="hint" style="margin-bottom:6px">The look asked for on every image.
        The marks of a hand, construction lines, uneven hatching, an unfinished edge,
        are what keep it from looking machine-made.</div>
      <textarea rows="4" oninput="imgEdit('style',this.value)">${esc(c.style)}</textarea>
    </div>
    <div class="pr-sec">
      <div class="sec-head"><h3>Negative prompt</h3>
        <button class="lore-toggle" onclick="imgReset('negative')">reset</button></div>
      <div class="hint" style="margin-bottom:6px">What to steer away from. This list is long
        on purpose: asking for "pencil" does not by itself suppress the glossy 3D-render
        default these models fall back to.</div>
      <textarea rows="5" oninput="imgEdit('negative',this.value)">${esc(c.negative)}</textarea>
    </div>
    <div class="pr-sec">
      <div class="sec-head"><h3>Drawing variations</h3>
        <button class="lore-toggle" onclick="imgReset('style_seeds')">reset list</button></div>
      <div class="hint" style="margin-bottom:8px">A couple are picked at random per image, so
        two drawings of the same person don't come out identical. These vary the drawing,
        not the subject.</div>
      <div class="pr-row"><label>Used per image
        <input type="number" min="0" max="5" value="${c.seeds_per_image}"
          oninput="imgEdit('seeds_per_image',+this.value)"></label></div>
      <div class="pr-list pr-imgseeds">${(c.style_seeds||[]).map((sd,i)=>`<div class="pr-item">
        <input value="${esc(sd)}" oninput="imgSeed(${i},this.value)">
        <button class="jr-x" onclick="imgSeedRemove(${i})">&times;</button></div>`).join('')}</div>
      <button class="btn" onclick="imgSeedAdd()">+ Add</button>
    </div>
    <div class="pr-sec">
      <h3>Quality and size</h3>
      <div class="pr-row">
        <label>Steps <input type="number" min="8" max="60" value="${c.steps}" oninput="imgEdit('steps',+this.value)"></label>
        <label>CFG <input type="number" min="1" max="15" step="0.5" value="${c.cfg_scale}" oninput="imgEdit('cfg_scale',+this.value)"></label>
        <label>Width <input type="number" min="256" max="1024" step="64" value="${c.width}" oninput="imgEdit('width',+this.value)"></label>
        <label>Height <input type="number" min="256" max="1024" step="64" value="${c.height}" oninput="imgEdit('height',+this.value)"></label>

}
function imgEdit(k,v){ IMGCFG[k]=v; const e=document.getElementById('imgSaved'); if(e) e.textContent='unsaved'; }
function imgSeed(i,v){ IMGCFG.style_seeds[i]=v; imgEdit('_',''); }
function imgSeedRemove(i){ IMGCFG.style_seeds.splice(i,1); renderImageStyle(); }
function imgSeedAdd(){ IMGCFG.style_seeds.push(''); renderImageStyle(); }
function imgReset(key){
  const d=(IMGCFG.defaults||{})[key];
  if(d===undefined) return;
  IMGCFG[key]=JSON.parse(JSON.stringify(d)); renderImageStyle();
}
async function imgSave(){

  ['style','negative','style_seeds','portrait_template','scene_template',
   'seeds_per_image','steps','cfg_scale','width','height','sampler'].forEach(k=>body[k]=IMGCFG[k]);
  body.style_seeds=(body.style_seeds||[]).map(x=>String(x).trim()).filter(Boolean);
  IMGCFG=await apiPost('/image_prompts',body);

  const e=document.getElementById('imgSaved'); if(e) e.textContent='saved';

async function imgResetAll(){

  try{ IMGCFG.defaults=(await api('/image_prompts')).defaults; }catch(e){}

async function runImageGen(body, waiting){
  const d=STATE.entity; if(!d) return;
  $('#modal').innerHTML=`<h3>${esc(waiting)}</h3>
    <p class="hint">Graphite takes a moment. This runs entirely on your own machine.
    Nothing is sent anywhere.</p>
    <div class="img-wait"><div class="img-wait-bar"></div></div>
    <div class="hint" id="imgTimer" style="margin-top:6px">0s</div>`;
  openModal();
  const t0=Date.now();
  const tick=setInterval(()=>{
    const e=document.getElementById('imgTimer');
    if(e) e.textContent=Math.floor((Date.now()-t0)/1000)+'s';
  },1000);
  try{
    const r=await fetch(`${API}/generate_image/${STATE.world}/${d._etype}/${d.id}`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){ clearInterval(tick); await explainImageFailure(j.error); return; }
    clearInterval(tick);
    if(window.playSfx) playSfx('modalOpen',0.4);
    $('#modal').innerHTML=`<h3>Drawn</h3>
      <img class="img-result" src="/userdata/images/${esc(j.filename)}" alt="">
      <p class="hint">Saved to this page's images. Star it there to make it the card thumbnail.</p>
      <details><summary class="hint">What it was told to draw</summary>
        <div class="pr-preview" style="margin-top:6px">${esc(j.prompt)}</div></details>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal();route()">Done</button>
        <button class="btn primary" onclick="closeModal();runImageGen(${JSON.stringify(body).replace(/"/g,'&quot;')},'Drawing again…')">Draw another</button>
      </div>`;
  }catch(e){
    clearInterval(tick);
    await explainImageFailure(e&&e.message);
  }
}
async function explainImageFailure(msg){
  let d=null;
  try{ d=await api('/image_status'); }catch(e){}
  const show=h=>{ $('#modal').innerHTML=h+
    `<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`;
    openModal(); };
  if(!d){ toast(msg||'Image generation failed.'); return; }
  if(!d.reachable){
    show(`<h3>No image server running</h3>
      <p>DwarfWiki tried <code>${esc(d.host)}</code> and got no answer.</p>
      <p class="hint">Image generation needs a local Stable Diffusion WebUI.
      <b>Forge</b> is the recommended one. Install it, launch it with the
      <code>--api</code> flag, and leave it running alongside DwarfWiki.</p>
      <p class="hint">Everything stays on your machine. Nothing is uploaded anywhere.</p>`);
    return;
  }
  if(!d.models||!d.models.length){
    show(`<h3>No model loaded</h3>
      <p>The image server is running, but has no checkpoint to draw with.</p>
      <p class="hint">Download a model into its <code>models/Stable-diffusion</code>
      folder and select it in that app, then try again.</p>`);
    return;
  }
  show(`<h3>Drawing failed</h3><p>${esc(msg||'Unknown error.')}</p>
    <p class="hint">The server is up with ${d.models.length} model(s) loaded, so this is
    likely speed or memory. Try lowering the step count in Settings &rarr; Image style.</p>`);
}

/* ============================================================
   WORLD UPDATE + CONFLICT QUEUE
   Re-import a world's legends data years later without losing
   your work. Untouched things just update; things you edited
   whose underlying facts have since changed come here to be
   decided rather than silently resolved either way.
   ============================================================ */
async function viewUpdateWorld(world){
  const w=world||STATE.world;
  let conf={items:[]};
  try{ conf=await api('/world/'+w+'/conflicts'); }catch(e){}
  const n=(conf.items||[]).length;

function renderConflicts(w,conf){
  const items=conf.items||[];
  if(!items.length) return `<div class="empty-hint">Nothing to review.
    ${conf.generated?`Last checked ${esc(conf.generated)}.`:''}</div>`;
  return items.map(it=>{
    if(it.kind==='missing') return `<div class="cf cf-missing">
      <div class="cf-h"><b>${esc(it.name||it.key)}</b><span class="cf-tag">gone</span></div>
      <p class="hint">${esc(it.detail)}</p>
      <div class="cf-acts"><button class="btn" onclick="resolveConflict('${w}','${it.id}','keep')">Understood</button></div>
    </div>`;
    if(it.kind==='renamed') return `<div class="cf cf-renamed">
      <div class="cf-h"><b>${esc(it.new_text)}</b><span class="cf-tag">renamed</span></div>
      <p class="hint">${esc(it.detail)} Previously <b>${esc(it.old_text)}</b>.</p>
      <div class="cf-acts"><button class="btn" onclick="resolveConflict('${w}','${it.id}','keep')">Understood</button></div>
    </div>`;
    return `<div class="cf">
      <div class="cf-h"><b>${esc(it.name)}</b> &mdash; ${esc(it.label||'')}
        <span class="cf-tag">changed</span></div>
      <p class="hint">${esc(it.detail)}</p>
      <div class="cf-cols">
        <div class="cf-col mine"><div class="cf-lab">Your version (kept)</div>
          <div class="cf-txt">${esc(it.mine||'')}</div></div>
        <div class="cf-col"><div class="cf-lab">What the world said before</div>
          <div class="cf-txt old">${esc(it.old_text||'')}</div></div>
        <div class="cf-col"><div class="cf-lab">What it says now</div>
          <div class="cf-txt new">${esc(it.new_text||'')}</div></div>
      </div>
      <div class="cf-acts">
        <button class="btn" onclick="resolveConflict('${w}','${it.id}','keep')">Keep mine</button>
        <button class="btn" onclick="resolveConflict('${w}','${it.id}','take')">Take the new one</button>
        <button class="btn" onclick="mergeConflict('${w}','${it.id}')">Merge&hellip;</button>
      </div>
    </div>`;
  }).join('');
}
async function runWorldUpdate(w){
  const base=$('#updBase').files[0], plus=$('#updPlus').files[0];
  const st=$('#updStatus');
  if(!base||!plus){ st.textContent='Both files are needed.'; return; }
  const fd=new FormData(); fd.append('base',base); fd.append('plus',plus);
  st.textContent='Uploading…';
  try{
    const r=await fetch(API+'/world/'+w+'/update',{method:'POST',body:fd});
    if(!r.ok) throw new Error(await r.text());
    const j=await r.json();
    st.textContent=`Parsing the new export… (${j.edited_entities} edited entries will be checked)`;
    const poll=setInterval(async()=>{
      let s2; try{ s2=await api('/reimport_status/'+w); }catch(e){ return; }
      if(/^done/.test(s2.status)){
        clearInterval(poll);
        st.textContent=s2.status;
        if(window.playSfx) playSfx('modalOpen',0.4);
        viewUpdateWorld(w);
      }else if(/^error/.test(s2.status)){
        clearInterval(poll); st.textContent=s2.status;
      }
    },2500);
  }catch(e){ st.textContent='Update failed: '+e.message; }
}
async function resolveConflict(w,id,choice){
  try{
    await apiPost('/world/'+w+'/conflicts',{id,choice});
    if(window.playSfx) playSfx('uiClick',0.3);
    viewUpdateWorld(w);
  }catch(e){ toast('Could not resolve: '+e.message); }
}
async function mergeConflict(w,id){
  const conf=await api('/world/'+w+'/conflicts');
  const it=(conf.items||[]).find(x=>x.id===id);
  if(!it) return;
  $('#modal').innerHTML=`<h3>Merge</h3>
    <p class="hint">Edit freely, this replaces your saved version for this section.</p>
    <textarea id="mergeBox" rows="12" style="width:100%;font-family:var(--serif);font-size:14px;
      padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--input-bg)">${esc(it.mine||'')}</textarea>
    <div class="cf-acts" style="margin-top:8px">
      <button class="btn" onclick="mergeInsert('old')">Insert the old account</button>
      <button class="btn" onclick="mergeInsert('new')">Insert the new account</button>
    </div>
    <div class="modal-actions">
      <button class="btn primary" onclick="mergeSave('${w}','${id}')">Save merged</button>
      <button class="btn" onclick="closeModal()">Cancel</button></div>`;
  window._mergeItem=it;

}
function mergeInsert(which){
  const it=window._mergeItem; const box=document.getElementById('mergeBox');
  if(!it||!box) return;
  const add=which==='old'?it.old_text:it.new_text;
  box.value=(box.value?box.value.trim()+'\n\n':'')+(add||'');
  box.focus();
}
async function mergeSave(w,id){
  const box=document.getElementById('mergeBox');
  await apiPost('/world/'+w+'/conflicts',{id,choice:'merge',text:box?box.value:''});
  closeModal(); viewUpdateWorld(w);

async function clearConflicts(w){
  if(!confirm('Dismiss every item in the review queue? Nothing is changed. They just stop being listed.')) return;
  await apiPost('/world/'+w+'/conflicts',{action:'clear'});
  viewUpdateWorld(w);
}

/* ============================================================
   AI PROMPT EDITOR
   The prompts live in userdata/prompts.json, so edits survive
   updates and can be reset. The style-seed pool is the important
   part: a constant prompt produces constant imagery, which is
   why generated pages kept reaching for the same phrases.
   ============================================================ */
let PROMPTS=null;
async function viewPrompts(){
  $('#view').innerHTML=`<div class="loading">Loading prompts…</div>`;
  try{ PROMPTS=await api('/prompts'); }
  catch(e){ $('#view').innerHTML=`<div class="empty">Couldn't load prompts: ${esc(e.message)}</div>`; return; }
  renderPrompts();
}
function renderPrompts(){
  const p=PROMPTS;
  const box=(key,label,hint)=>`
    <div class="pr-sec">
      <div class="sec-head"><h3>${label}</h3>
        <button class="lore-toggle" onclick="promptReset('${key}')">reset this one</button></div>
      <div class="hint" style="margin-bottom:6px">${hint}</div>
      <textarea rows="14" oninput="promptEdit('${key}',this.value)">${esc(p[key]||'')}</textarea>
    </div>`;
  $('#view').innerHTML=`
    <div class="crumbs">Settings &rsaquo; AI prompts</div>
    <h1 style="margin:0 0 4px">AI prompts</h1>
    <p class="lead-para">What the model is told before it writes. Edited here, stored in
      <code>userdata/prompts.json</code>, and safe from updates.</p>

    <div class="pr-sec">
      <div class="sec-head"><h3>Style seeds</h3>
        <button class="lore-toggle" onclick="promptReset('style_seeds')">reset list</button></div>
      <div class="hint" style="margin-bottom:8px">
        A constant prompt produces constant imagery, which is why generated pages kept
        reaching for the same phrases. Each generation draws a few of these at random,
        so two passages about the same figure get different instructions and diverge
        at the source.
        <br>These steer <i>how</i> the model writes, not <i>what</i> it describes.
        Telling it to write about crags is precisely how you get crags on every page.
      </div>
      <div class="pr-row">
        <label>Seeds used per generation
          <input type="number" min="0" max="8" value="${p.seeds_per_generation}"
            oninput="promptEdit('seeds_per_generation',+this.value)"></label>
        <span class="hint">${(p.style_seeds||[]).length} in the pool,
          ${combos(p.style_seeds.length,p.seeds_per_generation)} possible combinations</span>
      </div>
      <div class="pr-list pr-seeds">
        ${(p.style_seeds||[]).map((sd,i)=>`<div class="pr-item">
          <input value="${esc(sd)}" oninput="promptSeed(${i},this.value)">
          <button class="jr-x" onclick="promptSeedRemove(${i})">&times;</button></div>`).join('')}
      </div>
      <button class="btn" onclick="promptSeedAdd()">+ Add a seed</button>
    </div>

    <div class="pr-sec">
      <div class="sec-head"><h3>Banned phrases</h3>
        <button class="lore-toggle" onclick="promptReset('banned_phrases')">reset list</button></div>
      <div class="hint" style="margin-bottom:8px">Named outright, because a vague "be original"
        does far less than a concrete ban. Add whatever you catch it overusing.</div>
      <div class="pr-list pr-banned">
        ${(p.banned_phrases||[]).map((b,i)=>`<div class="pr-item">
          <input value="${esc(b)}" oninput="promptBanned(${i},this.value)">
          <button class="jr-x" onclick="promptBannedRemove(${i})">&times;</button></div>`).join('')}
      </div>
      <button class="btn" onclick="promptBannedAdd()">+ Add a phrase</button>
    </div>

    ${box('biography','Biography prompt','Used for figures. The sections on a person\'s page.')}
    ${box('encyclopedia','Encyclopedia prompt','Used for sites, civilizations, artifacts and the rest.')}
    ${box('commerce','Commerce prompt','Used for the trade section on settlements.')}

    <div class="pr-actions">
      <button class="btn primary" onclick="promptSave()">Save prompts</button>
      <button class="btn" onclick="promptPreview()">Preview what gets sent</button>
      <button class="btn danger" onclick="promptResetAll()">Reset everything to defaults</button>
      <span id="prSaved" class="hint"></span>
    </div>`;
}
function combos(n,k){
  if(!n||!k||k>n) return 0;
  let r=1; for(let i=0;i<k;i++) r=r*(n-i)/(i+1);
  return Math.round(r).toLocaleString();
}
function promptEdit(k,v){ PROMPTS[k]=v; markPr(); }
function promptSeed(i,v){ PROMPTS.style_seeds[i]=v; markPr(); }
function promptSeedRemove(i){ PROMPTS.style_seeds.splice(i,1); renderPrompts(); markPr(); }
function promptSeedAdd(){ PROMPTS.style_seeds.push(''); renderPrompts(); markPr(); }
function promptBanned(i,v){ PROMPTS.banned_phrases[i]=v; markPr(); }
function promptBannedRemove(i){ PROMPTS.banned_phrases.splice(i,1); renderPrompts(); markPr(); }
function promptBannedAdd(){ PROMPTS.banned_phrases.push(''); renderPrompts(); markPr(); }
function markPr(){ const e=document.getElementById('prSaved'); if(e) e.textContent='unsaved changes'; }
async function promptSave(){
  const body={};
  ['biography','encyclopedia','commerce','style_seeds','banned_phrases','seeds_per_generation']
    .forEach(k=>body[k]=PROMPTS[k]);
  body.style_seeds=(body.style_seeds||[]).map(x=>String(x).trim()).filter(Boolean);
  body.banned_phrases=(body.banned_phrases||[]).map(x=>String(x).trim()).filter(Boolean);
  try{
    PROMPTS=await apiPost('/prompts',body);
    PROMPTS.defaults=PROMPTS.defaults||{};
    toast('Prompts saved.');
    const e=document.getElementById('prSaved'); if(e) e.textContent='saved';
  }catch(e){ toast('Save failed: '+e.message); }
}
function promptReset(key){
  const d=(PROMPTS.defaults||{})[key];
  if(d===undefined){ toast('No default recorded for that.'); return; }
  PROMPTS[key]=JSON.parse(JSON.stringify(d));
  renderPrompts(); markPr();
}
async function promptResetAll(){
  if(!confirm('Reset every prompt, seed and banned phrase to the shipped defaults?')) return;
  PROMPTS=await apiPost('/prompts',{action:'reset'});
  try{ PROMPTS.defaults=(await api('/prompts')).defaults; }catch(e){}
  renderPrompts(); toast('Reset to defaults.');
}
async function promptPreview(){
  try{
    const d=await api('/prompts/preview?kind=biography');
    $('#modal').innerHTML=`<h3>What gets sent right now</h3>
      <p class="hint">Style seeds are redrawn every generation, this is one roll of them.</p>

  }catch(e){ toast('Preview failed: '+e.message); }
}

   SHELF  (fixed numbered-slot grid. Rename + reassign live here)
   ============================================================ */
async function viewShelf(){
  $('#view').innerHTML=`<div class="loading">Unrolling the shelf…</div>`;
  const d=await api('/worlds');
  let html=`<div class="crumbs"><a href="#/">Atlas</a> › Shelf</div>
    <h1 style="margin:0 0 4px">The Shelf</h1>
    <div class="muted" style="margin-bottom:14px">Arrange worlds into numbered slots. Assigning an occupied slot swaps the two.</div>`;

  if(!d.worlds.length){
    html+=`<div class="empty">No worlds imported yet.</div>`;
    $('#view').innerHTML=html; return;
  }

  const COLS=8;
  const maxSlot=Math.max(32, ...d.worlds.map(w=>w.slot||0));
  const rows=Math.ceil(maxSlot/COLS);
  const bySlot={};
  d.worlds.forEach(w=>{ bySlot[w.slot]=w; });

  html+=`<div class="atlas-grid" style="grid-template-columns:repeat(${COLS},minmax(120px,1fr))">`;
  for(let slot=1; slot<=rows*COLS; slot++){
    const w=bySlot[slot];
    if(!w){ html+=`<div class="atlas-empty"></div>`; continue; }
    html+=`<div class="atlas-card" data-world="${w.name}">
      <div class="ac-cardctl">
        <button class="ac-ctl-btn" title="Rename" onclick="event.preventDefault();renameWorld('${w.name}','${jsAttr(w.world_name)}','shelf')">✎</button>
        <button class="ac-ctl-btn" title="Move to a different shelf slot" onclick="event.preventDefault();reslotWorld('${w.name}',${slot})">#${slot}</button>
      </div>
      <a href="#/w/${w.name}/home">
        <div class="ac-map"><img src="${API}/w/${w.name}/map.png" loading="lazy" alt=""></div>
        <div class="ac-body">
          <div class="ac-title">${esc(w.world_name)}</div>
          <div class="ac-sub">Year ${w.year_max!=null?w.year_max:'?'} · ${(w.counts.figures||0).toLocaleString()} figures</div>
        </div>
      </a>
    </div>`;
  }
  html+=`</div>`;
  $('#view').innerHTML=html;
}

  await apiPost(`/world_meta/${world}`,{action:'set_slot',slot});

let browseState={};
async function viewBrowse(type, page){
  type=type||'hf';

function renderBrowseShell(){
  const t=browseState.type;
  const filters=filterOptionsFor(t);
  $('#view').innerHTML=`
    <div class="crumbs"><a href="#/w/${STATE.world}/home">${esc(STATE.meta.world_name||STATE.world)}</a> › ${TYPE_PLURAL[t]}</div>
    <h1 style="margin:0 0 12px">${TYPE_PLURAL[t]}</h1>
    <div class="toolbar">
      <input id="bq" placeholder="Filter by name…" oninput="debBrowse()" value="${esc(browseState.q)}">
      <label>Sort:
        <select id="bsort" onchange="browseState.sort=this.value;browseState.page=0;loadBrowse()">
          <option value="notable">Notable first</option>
          <option value="name">Name A–Z</option>
          <option value="events">Most eventful</option>
        </select></label>
      ${filters?`<label>${filters.label}: <select id="bfil" onchange="browseState.filter=this.value;browseState.page=0;loadBrowse()"><option value="">all</option>${filters.opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`:''}
      ${t==='hf'?`<label class="mono"><input type="checkbox" id="bnot" onchange="browseState.notable=this.checked;browseState.page=0;loadBrowse()"> notable only</label>`:''}
      <span id="bcount" class="muted"></span>
    </div>
    <div id="blist"><div class="loading">Loading…</div></div>
    <div id="bpager"></div>`;
  $('#bsort').value=browseState.sort;
}
function filterOptionsFor(t){
  const c=STATE.meta.census||{};
  if(t==='hf'){const o=Object.entries(c.by_race||{}).sort((a,b)=>b[1]-a[1]).slice(0,25).map(e=>e[0]);return o.length?{label:'Race',opts:o}:null;}
  if(t==='site'){const o=Object.keys(c.site_types||{});return o.length?{label:'Type',opts:o}:null;}
  if(t==='ent'){const o=Object.keys(c.entity_types||{});return o.length?{label:'Type',opts:o}:null;}
  if(t==='wc'){const o=Object.keys(c.written_forms||{});return o.length?{label:'Form',opts:o}:null;}
  return null;
}
let debT;
function debBrowse(){clearTimeout(debT);browseState.q=$('#bq').value;debT=setTimeout(()=>{browseState.page=0;loadBrowse()},220);}
async function loadBrowse(){
  const b=browseState;
  const qs=`?page=${b.page}&sort=${b.sort}&q=${encodeURIComponent(b.q)}${b.notable?'&notable=1':''}${b.filter?'&filter='+encodeURIComponent(b.filter):''}`;
  const d=await api(`/w/${STATE.world}/list/${b.type}${qs}`);
  $('#bcount').textContent=`${d.total.toLocaleString()} ${TYPE_PLURAL[b.type].toLowerCase()}`;
  if(!d.items.length){ $('#blist').innerHTML=`<div class="empty">Nothing matches.</div>`; $('#bpager').innerHTML=''; return; }
  $('#blist').innerHTML=`<div class="grid">`+d.items.map(it=>cardFor(b.type,it)).join('')+`</div>`;
  const pages=Math.ceil(d.total/d.per);
  $('#bpager').innerHTML=pager(b.page,pages);
}
function cardFor(type,it){
  const dead = it.dead;
  const sub = [it.sub, it.events?`${it.events} events`:''].filter(Boolean).join(' · ');
  const born = (type==='hf'&&it.born!=null)? ` · b.${it.born}`:'';
  // thumb comes from whichever gallery image is starred (or the first, if
  // none is). Fixed height in CSS, so a page of cards stays on one grid
  // regardless of how many images any given entity has.
  const thumb = it.thumb
    ? `<div class="card-thumb" style="background-image:url('/userdata/images/${esc(it.thumb)}')"></div>`
    : `<div class="card-thumb empty">${TYPE_GLYPH[type]||'&#9670;'}</div>`;
  return `<div class="card" data-type="${type}" data-id="${it.id}" data-name="${esc(it.name)}">
    <a href="#/w/${STATE.world}/${type}/${it.id}">
      ${thumb}
      <div class="card-body">
        <div class="nm">${type==='hf'?`<span class="dot ${dead?'dead':''}"></span>`:''}${esc(properName(it.name))}</div>
        <div class="meta">${esc(sub)}${born}</div>
      </div>
    </a>
  </div>`;
}
const TYPE_GLYPH={hf:'&#9823;',site:'&#127984;',ent:'&#9876;',artifact:'&#9878;',wc:'&#128220;',creature:'&#128062;',region:'&#9968;'};
function pager(page,pages){
  if(pages<=1) return '';
  return `<div class="pager">
    <button ${page<=0?'disabled':''} onclick="browseState.page=${page-1};loadBrowse();scrollTop()">← Prev</button>
    <span>Page ${page+1} of ${pages}</span>
    <button ${page>=pages-1?'disabled':''} onclick="browseState.page=${page+1};loadBrowse();scrollTop()">Next →</button>
  </div>`;
}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
