<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dwarfipedia</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="manifest" href="/manifest.json">
<style>
/* ===================== THEME ===================== */
:root{
  --bg:#efe9dc; --panel:#f7f2e7; --ink:#241f18; --soft:#6a6154;
  --line:#d8cdb4; --accent:#7a2e2e; --accent2:#3a5a40;
  --link:#7a2e2e; --link-hover:#a23b3b; --chip:#e7dcc4; --input-bg:#fffdf7;
  --shadow:0 1px 3px rgba(60,45,20,.15);
  /* A named palette, so a category can have its own colour instead of
     everything being the same maroon. Kept muted and earthy. These read as
     inks and pigments, not as a web framework's default swatches.
     (--gold was previously "#8a6d996", a seven-digit hex, i.e. invalid and
     silently ignored by every browser.) */
  --gold:#9a7b3c; --rust:#a05a2c; --moss:#4a6b3a; --slate:#48607a;
  --plum:#6b3f5e; --teal:#2f6b68; --ochre:#b08432; --wine:#7a2e40;
  --ink-blue:#33507a; --forest:#2f5340; --clay:#8c5a44; --stone:#6a6a72;
  /* entity types get a consistent colour everywhere they appear */
  --c-hf:var(--wine); --c-site:var(--slate); --c-ent:var(--gold);
  --c-artifact:var(--plum); --c-wc:var(--teal); --c-creature:var(--moss);
  --c-region:var(--clay); --c-adv:var(--rust);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
body.dark-mode{
  --bg:#1c1a17; --panel:#262320; --ink:#e8e0d0; --soft:#a89e8a;
  --line:#3a352e; --chip:#332e27; --input-bg:#211e1a;
  --shadow:0 1px 4px rgba(0,0,0,.5);
  /* THE DARK MODE BUG: --accent and --link were never overridden here, so
     every heading, link and active tab stayed dark maroon (#7a2e2e) on a
     near-black background. Legible only just, and not at all in places.
     Every colour the palette defines needs a light-on-dark counterpart. */
  --accent:#d99a6c; --accent2:#7fbf95;
  --link:#e0a878; --link-hover:#f0c49a;
  --gold:#d4ac5e; --rust:#d98a55; --moss:#8fbf76; --slate:#8aa8c8;
  --plum:#c48fb4; --teal:#6fbdb6; --ochre:#dcb45e; --wine:#d4879a;
  --ink-blue:#8fb0dc; --forest:#7fc0a0; --clay:#c9927a; --stone:#a8a8b4;
}
/* Component colours hardcoded for the light theme. Each needs a dark
   counterpart or it stays dark-on-dark, this is the rest of the "not every
   text turns white" problem, beyond the accent variables above. */
body.dark-mode .pill{color:#d8c9a4;background:#332e27;border-color:#463f35}
body.dark-mode .ar-status{background:#2d3a2a;color:#9fd18f}
body.dark-mode .ar-status.retired{background:#3a342a;color:#d4bd7e}
body.dark-mode .ar-status.deceased{background:#3a2a27;color:#dfa093}
body.dark-mode .attr-v.v0,body.dark-mode .attr-v.v1{color:#e0b95e}
body.dark-mode .attr-v.v2,body.dark-mode .attr-v.v3{color:#9ec47a}
body.dark-mode .attr-v.v5,body.dark-mode .attr-v.v6{color:#d09a86}
body.dark-mode .attr-v.v7,body.dark-mode .attr-v.v8{color:#e08a8a}
body.dark-mode .sk-v.l12,body.dark-mode .sk-v.l13,body.dark-mode .sk-v.l14,
body.dark-mode .sk-v.l15,body.dark-mode .sk-v.l16{color:#e0b95e}
body.dark-mode .jr-x:hover,body.dark-mode .fb-x:hover,
body.dark-mode .tools-menu button.danger:hover{background:#4a2b28;color:#f0a094}
body.dark-mode .jr-due{background:#3d3427;color:#e6c27e}
body.dark-mode .q-active .q-gh{color:#8fc47f}
body.dark-mode .q-completed .q-gh{color:#a09a90}
body.dark-mode .q-failed .q-gh{color:#e08a8a}
body.dark-mode .btn.danger{border-color:#7a4a44;color:#e89a90}
body.dark-mode .btn.danger:hover{background:#4a2b28}
body.dark-mode .badge-wordbank{background:#37322a;color:#cbb98e}
body.dark-mode .badge-edited{background:#2b3a30;color:#8fd0a4}
body.dark-mode .badge-llm{background:#3a2c2c;color:#e0a0a0}
body.dark-mode .wsw.on{border-color:#f0e0b0}
body.dark-mode .cf-txt{background:#211e1a}
body.dark-mode .cf-col.mine .cf-txt{background:#2e2820;border-color:#6b5a34}
body.dark-mode .pr-preview,body.dark-mode .pr-sec textarea,
body.dark-mode .as-col textarea,body.dark-mode .as-sec textarea{background:#211e1a;color:var(--ink)}
body.dark-mode .card-thumb.empty{background:linear-gradient(160deg,#2a2622,#221f1b);color:#4d463c}
body.dark-mode .ar-port.empty,body.dark-mode .as-port.empty{background:#2a2622;color:#4d463c}
body.dark-mode .img-result{background:#2a2622}
body.dark-mode .fb-table tr:nth-child(even){background:rgba(255,240,200,.035)}
body.dark-mode .ev-table tbody tr:nth-child(odd){background:rgba(255,240,200,.035)}
body.dark-mode .ev-table tbody tr:hover{background:rgba(255,240,200,.08)}
body.dark-mode .toc-count,body.dark-mode .fh-count,body.dark-mode .q-n{background:rgba(255,255,255,.09)}
body.dark-mode .icon-btn:hover,body.dark-mode .settings-menu button:hover,
body.dark-mode .tools-menu button:hover,body.dark-mode .tabdrop-menu a:hover{background:#332e27}
body.dark-mode .lead-para strong{color:var(--ink)}

body.dark-mode .ac-map,body.dark-mode .map-viewport,body.dark-mode .hero-map-link{background:#12110f}
body.dark-mode .lore-text::first-letter{color:var(--accent)}

/* ===================== ADDITIONAL THEMES =====================
   Everything above keys off the CSS variables set in :root and
   body.dark-mode, so a new theme is mostly "redefine the variables".
   hc-mode is a contrast BOOSTER, meant to be combined with dark-mode
   (for "High contrast dark") or used alone (for "High contrast
   light"). It doesn't duplicate the dark-mode component overrides,
   it just pushes bg/ink/line further apart and reuses whichever
   component palette (light or dark) is already active. Sepia and
   Forest are standalone light palettes. Same light-ink-on-light-bg
   relationship as the default theme, so the light theme's existing
   hardcoded component colours (badges, warnings, etc.) still read
   fine against them without needing their own override block. */
body.hc-mode:not(.dark-mode){
  --bg:#ffffff; --panel:#ffffff; --ink:#000000; --soft:#333333;
  --line:#000000; --accent:#8b0000; --accent2:#1c5c1c;
  --link:#8b0000; --link-hover:#b30000; --chip:#e8e8e8; --input-bg:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.6);
}
body.hc-mode.dark-mode{
  --bg:#000000; --panel:#0a0a0a; --ink:#ffffff; --soft:#d8d8d8;
  --line:#ffffff; --accent:#ffcc55; --accent2:#7fe090;
  --link:#7fd7ff; --link-hover:#aeeaff; --chip:#1a1a1a; --input-bg:#111111;
  --shadow:0 1px 2px rgba(255,255,255,.25);
}
body.sepia-mode{
  --bg:#efdfb8; --panel:#f7ecd2; --ink:#3a2a15; --soft:#7a6543;
  --line:#d6bd88; --accent:#8a4a1f; --accent2:#5a6b2e;
  --link:#8a4a1f; --link-hover:#b8702f; --chip:#e6d19c; --input-bg:#fff8e8;
  --shadow:0 1px 3px rgba(80,50,10,.22);
  --gold:#9a7b3c; --rust:#a05a2c; --moss:#5a7a3a; --slate:#5a7a94;
  --plum:#7a4f6e; --teal:#3f7b78; --ochre:#b08432; --wine:#8a3a4a;
  --ink-blue:#43608a; --forest:#3f6340; --clay:#9c6a54; --stone:#7a7a82;
}
body.sepia-dark-mode{
  --bg:#2a1f10; --panel:#332614; --ink:#f0e0c0; --soft:#c9b088;
  --line:#5a4526; --accent:#d68a3a; --accent2:#8a9a4a;
  --link:#d68a3a; --link-hover:#f0a850; --chip:#4a3a1e; --input-bg:#251b0e;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
body.forest-mode{
  --bg:#e2ead4; --panel:#eef4e4; --ink:#1c2a17; --soft:#57684e;
  --line:#c2d1ac; --accent:#2f5e3a; --accent2:#7a3a2e;
  --link:#2f5e3a; --link-hover:#43804f; --chip:#d5e3c0; --input-bg:#fafdf5;
  --shadow:0 1px 3px rgba(20,40,10,.18);
}
body.forest-dark-mode{
  --bg:#131f14; --panel:#182618; --ink:#dcead0; --soft:#a0b890;
  --line:#345034; --accent:#5aa668; --accent2:#c08060;
  --link:#5aa668; --link-hover:#7ac488; --chip:#26402a; --input-bg:#101a10;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
body.amber-mode{
  --bg:#f5e6c8; --panel:#faf0da; --ink:#3d2b12; --soft:#7a5f3a;
  --line:#dcc48a; --accent:#b5651d; --accent2:#5c4a1e;
  --link:#b5651d; --link-hover:#d68a3a; --chip:#ecd9a8; --input-bg:#fffaf0;
  --shadow:0 1px 3px rgba(90,60,10,.2);
}
body.amber-dark-mode{
  --bg:#2c1c08; --panel:#38240c; --ink:#f5e2bc; --soft:#cba876;
  --line:#5c3f18; --accent:#e8922a; --accent2:#a8703a;
  --link:#e8922a; --link-hover:#ffab4a; --chip:#4a3212; --input-bg:#26190a;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
body.storm-mode{
  --bg:#dfe4ea; --panel:#e8ecf0; --ink:#1f2933; --soft:#54606e;
  --line:#b9c4cf; --accent:#3a5f7a; --accent2:#6a4a3a;
  --link:#3a5f7a; --link-hover:#547f9e; --chip:#ccd5dc; --input-bg:#f5f7f9;
  --shadow:0 1px 3px rgba(20,30,40,.18);
}
body.storm-dark-mode{
  --bg:#11181f; --panel:#161f28; --ink:#dbe4ea; --soft:#9fb0bd;
  --line:#334452; --accent:#5b93b8; --accent2:#b88a6a;
  --link:#5b93b8; --link-hover:#7fb3d8; --chip:#233240; --input-bg:#0e1419;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
/* ---- Bold set. Same light-ink-on-light-bg architecture as Sepia/Forest/
   Amber/Storm above (so no dark-mode component overrides needed), but
   pushed hard on saturation and contrast instead of staying muted/earthy.
   All named for things that are already very Dwarf Fortress. ---- */
body.magma-mode{
  --bg:#ffe0c4; --panel:#fff0dc; --ink:#2b0a00; --soft:#8a3a10;
  --line:#f0a050; --accent:#e8380a; --accent2:#7a1a00;
  --link:#e8380a; --link-hover:#ff5a20; --chip:#ffcf9c; --input-bg:#fff8ef;
  --shadow:0 2px 4px rgba(180,40,0,.35);
}
body.magma-dark-mode{
  --bg:#240a02; --panel:#341005; --ink:#ffe0c0; --soft:#e08050;
  --line:#5c2408; --accent:#ff5a20; --accent2:#ff8a30;
  --link:#ff7a3a; --link-hover:#ff9a5a; --chip:#4a1c08; --input-bg:#1c0801;
  --shadow:0 2px 4px rgba(0,0,0,.45);
}
body.ichor-mode{
  --bg:#ffe0e0; --panel:#fff0f0; --ink:#2a0505; --soft:#7a1010;
  --line:#f0a0a0; --accent:#c40018; --accent2:#3a0000;
  --link:#c40018; --link-hover:#e8002a; --chip:#ffc0c0; --input-bg:#fff5f5;
  --shadow:0 2px 4px rgba(150,0,10,.35);
}
body.ichor-dark-mode{
  --bg:#230405; --panel:#330608; --ink:#ffd8d8; --soft:#e08a8a;
  --line:#5c1012; --accent:#ff3050; --accent2:#ff6a6a;
  --link:#ff4a5a; --link-hover:#ff7a85; --chip:#4a1012; --input-bg:#1a0303;
  --shadow:0 2px 4px rgba(0,0,0,.45);
}
body.miasma-mode{
  --bg:#d8f0c0; --panel:#e8f8d8; --ink:#1a2a05; --soft:#4a6a1a;
  --line:#a8d060; --accent:#6a1a8a; --accent2:#2a5a10;
  --link:#6a1a8a; --link-hover:#8a2ab0; --chip:#c0e090; --input-bg:#f2fce8;
  --shadow:0 2px 4px rgba(60,120,10,.3);
}
body.miasma-dark-mode{
  --bg:#141f08; --panel:#1c2a0c; --ink:#dcf0c0; --soft:#a8c078;

  --link:#c060f0; --link-hover:#d888ff; --chip:#2a4010; --input-bg:#101a06;

}

  --bg:#ede0f8; --panel:#f5ecff; --ink:#2a0a3a; --soft:#6a3a8a;
  --line:#c8a0e8; --accent:#b8860a; --accent2:#4a1a6a;
  --link:#8a2ab0; --link-hover:#a83ad0; --chip:#dcc0f5; --input-bg:#faf5ff;
  --shadow:0 2px 4px rgba(90,20,140,.3);
}
body.regalia-dark-mode{
  --bg:#1c0a28; --panel:#261034; --ink:#f0e0f8; --soft:#c090dc;
  --line:#4a2460; --accent:#e8b830; --accent2:#c060e0;
  --link:#d888ff; --link-hover:#e8b0ff; --chip:#3a1850; --input-bg:#160820;
  --shadow:0 2px 4px rgba(0,0,0,.45);
}
body.frostbite-mode{
  --bg:#d0f0f8; --panel:#e0f8fc; --ink:#052030; --soft:#1a5a7a;
  --line:#90d8ec; --accent:#0a8cc4; --accent2:#7a1a3a;
  --link:#0a8cc4; --link-hover:#20b0ea; --chip:#b0e8f5; --input-bg:#f0fcff;
  --shadow:0 2px 4px rgba(10,100,150,.3);
}
body.frostbite-dark-mode{
  --bg:#051520; --panel:#0a1f2c; --ink:#c8eef8; --soft:#7ab8cc;
  --line:#123a4c; --accent:#2ab0e8; --accent2:#e0607a;
  --link:#3ac0f5; --link-hover:#6ad4ff; --chip:#0e2e3e; --input-bg:#03101a;
  --shadow:0 2px 4px rgba(0,0,0,.45);

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .15s,color .15s}
a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(122,46,46,.28)}
a:hover{color:var(--link-hover);border-bottom-color:var(--link-hover)}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;color:var(--ink)}
button,input,select{font-family:var(--sans);font-size:14px}
/* <select> is the one form element that silently ignores inherited
   `color` in enough browsers to matter. Every dropdown across the app
   was falling back to the browser's own default text color regardless of
   theme, which only became visible as a real bug on Dark (black text on
   a dark background). One rule here covers every select site-wide,
   instead of patching each one's own class individually. */
select,select option{color:var(--ink);background:var(--input-bg)}
.mono{font-family:var(--sans)}

/* ===================== TOP BAR ===================== */
header{position:sticky;top:0;z-index:50;background:var(--panel);
  border-bottom:2px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;
  padding:9px 18px}
.brand{font-weight:700;font-size:21px;letter-spacing:.3px;color:var(--accent);
  cursor:pointer;border:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px;fill:var(--accent)}
.search-wrap{position:relative;flex:1;max-width:440px}
#search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:3px;
  background:var(--input-bg);outline:none;font-family:var(--sans);font-size:14px}
#search:focus{border-color:var(--accent)}
#suggest{position:absolute;left:0;right:0;top:38px;background:var(--input-bg);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 6px 20px rgba(50,35,10,.2);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
#suggest .s-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;
  border-bottom:1px solid #efe6d0;font-family:var(--sans);font-size:13px}
#suggest .s-item:hover{background:#f0e7d0}
#suggest .s-item .st{color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
#suggest .s-item.searching-hint{cursor:default;color:var(--soft);font-style:italic}
#suggest .s-item.searching-hint:hover{background:transparent}
.world-sel{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input-bg);
  color:var(--ink)}
.world-sel option{background:var(--input-bg);color:var(--ink)}
.top-actions{display:flex;gap:6px}
.recent-wrap{position:relative}
.recent-dropdown{display:none;position:absolute;top:38px;right:0;background:var(--input-bg);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 26px rgba(40,25,5,.25);width:280px;max-height:60vh;overflow-y:auto;z-index:60}
.recent-dropdown.open{display:block}
.recent-dropdown .rd-item{display:block;padding:9px 13px;border-bottom:1px solid #efe6d0;border-left:none;
  font-family:var(--sans);font-size:13px}
.recent-dropdown .rd-item:hover{background:#f0e7d0}
.recent-dropdown .rd-item .rd-type{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--soft)}
.recent-dropdown .rd-empty{padding:16px;text-align:center;color:var(--soft);font-family:var(--sans);font-size:13px}
.icon-btn{background:var(--input-bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.icon-btn:hover{background:#f0e7d0;border-color:var(--accent)}
.icon-btn svg{width:15px;height:15px;fill:currentColor}
.icon-btn.muted{opacity:.45}
.section h3{cursor:pointer;user-select:none;position:relative;transition:opacity .15s}
.section h3:hover{opacity:.75}
.section h3::before{content:'▾';display:inline-block;width:14px;font-size:14px;color:var(--soft);
  transition:transform .15s}
.section.collapsed h3::before{transform:rotate(-90deg)}
.section.collapsed>*:not(h3){display:none}
.section h3 button,.section h3 a,.section h3 .n{cursor:pointer}

/* ===================== NAV ===================== */
/* Flat toolbar. No icons anywhere in the bar. One item having a glyph and
   the rest not is worse than none having them, and the labels are already
   unambiguous. Weight and an underline carry the active state instead. */
nav.tabs{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;gap:0;flex-wrap:wrap;
  align-items:stretch;border-bottom:1px solid var(--line)}
nav.tabs a{font-family:var(--sans);font-size:13.5px;padding:9px 13px 8px;border-radius:0;
  color:var(--soft);border:none;position:relative;letter-spacing:.005em;
  border-bottom:2px solid transparent;transition:color .12s,border-color .12s,background .12s}
nav.tabs a:hover{background:rgba(140,120,80,.09);color:var(--ink)}
nav.tabs a.active{background:none;color:var(--accent);font-weight:600;
  border-bottom-color:var(--accent);box-shadow:none}
/* the dropdown parent shouldn't shift when its menu opens */
nav.tabs .tabdrop > a{display:flex;align-items:center;gap:5px}
.caret{display:inline-block;width:0;height:0;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.55;
  transition:transform .15s}
.tabdrop.open .caret{transform:rotate(180deg)}
.tabdrop.open > a{color:var(--accent);background:rgba(140,120,80,.09)}

/* ===================== LAYOUT ===================== */
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.wrap{max-width:820px}
.muted{color:var(--soft)}
.small{font-size:13px}
.center{text-align:center}
.pill{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:12px;
  padding:1px 9px;font-family:var(--sans);font-size:12px;color:#5a4d38;margin:2px 3px 2px 0}
.crumbs{font-family:var(--sans);font-size:13px;color:var(--soft);margin-bottom:14px}
.crumbs a{border:none}

/* ===================== ATLAS (multi-world landing) ===================== */
.atlas-hero{border-bottom:3px double var(--line);padding-bottom:14px;margin-bottom:18px}
.atlas-hero h1{font-size:44px;margin:0 0 4px;letter-spacing:.5px}
.atlas-hero .sub{font-family:var(--sans);color:var(--soft);font-size:15px;font-style:italic}
.google-hero{text-align:center;padding-bottom:22px}
.atlas-wordmark{font-size:28px;margin:0 0 18px;color:var(--soft);letter-spacing:1px;font-weight:400}
.hero-map-link{display:inline-block;border:none;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(40,25,10,.25);
  max-width:420px;transition:transform .15s}
.hero-map-link:hover{transform:scale(1.015)}
.hero-map-img{display:block;width:100%;max-width:420px;aspect-ratio:1/1;object-fit:cover;image-rendering:pixelated}
.atlas-search-row{max-width:560px;margin:22px auto 0}
.atlas-search-row input{width:100%;padding:12px 18px;border:1px solid var(--line);border-radius:24px;
  background:var(--input-bg);font-family:var(--sans);font-size:15px;box-shadow:var(--shadow)}
.atlas-search-row input:focus{outline:none;border-color:var(--accent)}
.atlas-search-btns{margin-top:14px;display:flex;gap:10px;justify-content:center}
.shelf-link{margin-top:16px;font-family:var(--sans);font-size:13px}
.shelf-link a{border:none;color:var(--soft)}
.shelf-link a:hover{color:var(--accent)}
.continue-strip{margin-bottom:20px;font-family:var(--sans)}
.continue-strip a{border:none;background:var(--chip);padding:8px 14px;border-radius:20px;font-size:14px}
.atlas-grid{display:grid;gap:14px}
.atlas-grid-auto{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.atlas-card{display:block;border:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s;position:relative}
.atlas-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,45,20,.22)}
.atlas-card.pending{opacity:.6}
.atlas-empty{border:1.5px dashed var(--line);border-radius:10px;opacity:.35;min-height:150px;aspect-ratio:1/1.28}
.archived-box{margin:26px auto 0;max-width:1180px;border-top:1px solid var(--line);padding-top:14px}
.archived-box summary{cursor:pointer;font-family:var(--serif);font-size:16px;padding:4px 0;user-select:none}
.archived-box summary:hover{color:var(--accent)}
.atlas-card.archived{opacity:.62}
.atlas-card.archived:hover{opacity:1}
.ac-cardctl{position:absolute;top:6px;right:6px;z-index:3;display:flex;gap:4px}
.ac-ctl-btn{font-family:var(--sans);font-size:11px;background:rgba(255,253,247,.92);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;cursor:pointer;color:var(--soft)}
.ac-ctl-btn:hover{background:#fff;color:var(--accent);border-color:var(--accent)}
.ac-map{aspect-ratio:1/1;background:#dcd3ba;overflow:hidden}
.ac-map img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.ac-map-pending{display:flex;align-items:center;justify-content:center;font-size:34px}
.ac-body{padding:10px 13px}
.ac-title{font-size:19px;font-weight:700;color:var(--ink)}
.ac-sub{font-family:var(--sans);font-size:12px;color:var(--soft);margin-top:2px}
.page-stats{font-family:var(--sans);font-size:12px;color:var(--soft);margin-top:26px;padding-top:10px;
  border-top:1px solid var(--line)}
.page-stats .ps-sep{margin:0 8px}
.add-world-card{cursor:pointer;border-style:dashed;opacity:.85}
.add-world-card:hover{opacity:1}
.add-world-card .ac-map-pending{font-size:40px;color:var(--soft);background:#eee4cc}
.add-world-detail{display:none;line-height:1.5}
.add-world-card.open .add-world-detail{display:block}
.add-world-card .ac-title::after{content:" ▾";color:var(--soft);font-size:12px}
.add-world-card.open .ac-title::after{content:" ▴"}
.add-world-detail code{background:#eee1c2;padding:1px 4px;border-radius:3px}

/* ===================== HOME / HEADLINES ===================== */
.hero{border-bottom:3px double var(--line);padding-bottom:14px;margin-bottom:20px}
.hero h1{font-size:40px;margin:0 0 2px}
.hero .sub{font-family:var(--sans);color:var(--soft);font-size:14px}
.headlines{column-width:360px;column-gap:26px}
.hl{break-inside:avoid;margin:0 0 16px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.hl .yr{font-family:var(--sans);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700}
.hl .body{font-size:19px;line-height:1.35;margin-top:3px}
.hl.big .body{font-size:23px}
.hl .tag{font-family:var(--sans);font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}

/* ===================== WORLD MAP ===================== */
.map-shell{display:flex;gap:16px;align-items:flex-start}
.map-viewport{flex:1;height:72vh;overflow:auto;border:1px solid var(--line);border-radius:8px;
  background:#dcd3ba;box-shadow:var(--shadow)}
.map-inner{position:relative;transition:width .12s,height .12s}
.map-inner img{display:block;image-rendering:pixelated;image-rendering:crisp-edges;user-select:none}
#mapPins{position:absolute;inset:0}
.map-pin{position:absolute;width:6px;height:6px;border-radius:50%;transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.65);cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.map-pin.big{width:10px;height:10px}
.map-pin:hover{outline:2px solid #fff;z-index:5}
.map-legend{width:170px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;font-family:var(--sans);font-size:13px;box-shadow:var(--shadow);position:sticky;top:80px}
.map-legend h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--soft);
  border-bottom:1px solid var(--line);padding-bottom:4px}
.leg-row{display:flex;align-items:center;gap:7px;padding:2px 0}
.leg-sw{width:13px;height:13px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.leg-dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}

/* ===================== LISTS ===================== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
  font-family:var(--sans);font-size:13px}
.toolbar input,.toolbar select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input-bg)}
/* ---- BROWSE CARDS: fixed-height thumb, titles on a consistent baseline ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;align-items:stretch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0;
  box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;overflow:hidden}
.card > a{display:flex;flex-direction:column;height:100%;text-decoration:none;color:inherit}
.card-thumb{height:96px;flex-shrink:0;background:#e5dcc4 center/cover no-repeat;
  border-bottom:1px solid var(--line)}
.card-thumb.empty{background:linear-gradient(160deg,#e9e0c8,#ded2b4);
  display:flex;align-items:center;justify-content:center;color:#bcae8e;font-size:22px}
.card-body{padding:9px 12px 11px;display:flex;flex-direction:column;flex:1;min-height:64px}
.card .nm{font-size:16px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-family:var(--sans);font-size:12px;color:var(--soft);margin-top:auto;padding-top:5px}
.card .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent2);margin-right:5px;vertical-align:middle}
.card .dot.dead{background:#a99}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:22px 0;font-family:var(--sans)}
.pager button{padding:6px 14px;border:1px solid var(--line);background:var(--input-bg);border-radius:6px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}

/* ===================== ENTITY PAGE ===================== */
.entity-head{border-bottom:3px double var(--line);padding-bottom:12px;margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.entity-head h1{font-size:33px;margin:0 0 4px}
.epithet{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--accent);margin:-2px 0 5px}
.entity-head .kind{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent)}
.entity-actions{display:flex;gap:6px;flex-shrink:0}
/* =========================================================================
   ADVENTURER SHEET
   Deliberately reads as a character sheet rather than an article: denser,
   ruled, tabular, with the sepia palette carried over so it still belongs
   to this app.
   ========================================================================= */
.adv-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:2px}
.adv-head h1{margin:0}
.adv-roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:18px}
.adv-card{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.adv-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,45,20,.22)}
.adv-card.deceased{opacity:.72}
.ar-port{width:84px;flex-shrink:0;background:#e5dcc4 center/cover no-repeat;border-right:1px solid var(--line)}
.ar-port.empty{display:flex;align-items:center;justify-content:center;font-size:26px;color:#bcae8e}
.ar-body{padding:10px 12px;flex:1;min-width:0}
.ar-name{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.2}
.ar-sub{font-size:13px;color:var(--soft);margin-top:1px}
.ar-skills{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.ar-skills .pill{font-size:11px;padding:2px 7px}
.ar-foot{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.ar-status{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;
  padding:1px 7px;border-radius:9px;background:#dfe9d8;color:#3c5c34}
.ar-status.retired{background:#e6dfc9;color:#6a5a2e}
.ar-status.deceased{background:#e8d8d2;color:#7a3428}

.adv-sheet{margin-top:8px}
.as-top{display:flex;gap:14px;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid var(--line)}
.as-port{width:96px;height:96px;flex-shrink:0;border:1px solid var(--line);border-radius:8px;
  background:#e5dcc4 center/cover no-repeat}
.as-port.empty{display:flex;align-items:center;justify-content:center;font-size:34px;color:#bcae8e}
.as-id{flex:1;min-width:0}
.as-name{width:100%;font-family:var(--serif);font-size:27px;font-weight:700;border:none;
  background:none;border-bottom:1px dashed transparent;color:var(--ink);padding:2px 0}
.as-name:hover,.as-name:focus{border-bottom-color:var(--line);outline:none}
.as-idrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.as-idrow label{font-size:11px;color:var(--soft);display:flex;flex-direction:column;gap:2px}
.as-idrow input,.as-idrow select{font-family:var(--sans);font-size:14.5px;padding:6px 9px;
  border:1px solid var(--line);border-radius:4px;background:var(--input-bg);color:var(--ink)}
.as-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.as-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 0 16px;flex-wrap:wrap}
.as-tabs button{font-family:var(--sans);font-size:14.5px;padding:10px 16px;background:none;border:none;
  border-bottom:2px solid transparent;color:var(--soft);cursor:pointer}
.as-tabs button:hover{background:rgba(140,120,80,.09);color:var(--ink)}
.as-tabs button.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.as-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media (max-width:900px){.as-cols{grid-template-columns:1fr}}
.as-cols-3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:1100px){.as-cols-3{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.as-cols-3{grid-template-columns:1fr}}

/* ---- calendar: full standalone page (bodyCalendar) ---- */
.cal-page{max-width:900px}
.cal-toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.cal-toolbar>button{width:34px;height:34px;border:1px solid var(--line);border-radius:5px;
  background:var(--input-bg);color:var(--ink);font-size:16px;cursor:pointer;flex-shrink:0}
.cal-toolbar>button:hover{border-color:var(--accent);color:var(--accent)}
.cal-title-big{font-family:var(--serif);font-size:24px;flex:1;min-width:160px}
.cal-year-picker{display:flex;align-items:center;gap:8px}
.cal-year-picker input{width:90px;font-family:var(--sans);font-size:14.5px;padding:6px 9px;
  border:1px solid var(--line);border-radius:4px;background:var(--input-bg);color:var(--ink)}
.cal-months-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.cal-months-row button{font-size:12.5px;padding:6px 11px;border:1px solid var(--line);border-radius:14px;
  background:var(--input-bg);color:var(--soft);cursor:pointer}
.cal-months-row button.on{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:700}
.cal-grid-big{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--soft);
  font-weight:700;padding-bottom:4px}
.cal-cell{aspect-ratio:1.15;border:1px solid var(--line);border-radius:6px;background:var(--input-bg);
  color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;
  justify-content:space-between;padding:6px 8px;position:relative}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.has-events{background:rgba(140,120,80,.12);border-color:var(--accent)}
.cal-cell.open{outline:2px solid var(--accent);outline-offset:-2px}
.cal-daynum{font-size:14px;font-weight:600}
.cal-marker{align-self:flex-end;font-size:11px;font-weight:700;color:var(--accent);
  background:var(--panel);border-radius:9px;padding:0 6px;min-width:16px;text-align:center}
.cal-daypanel{margin-top:18px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;
  background:var(--panel)}
.cal-event{padding:6px 0;border-bottom:1px solid rgba(140,120,80,.15);font-size:14px;line-height:1.6}
.cal-event:last-child{border-bottom:none}
.cal-event a{color:var(--link)}
.cal-event a:hover{color:var(--link-hover)}
.as-col h3{font-family:var(--serif);font-size:19px;margin:0 0 8px;padding-bottom:4px;
  border-bottom:1px solid var(--line)}
.as-lab{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--soft);font-weight:700;margin:10px 0 3px}
.as-col input,.as-col textarea,.as-sec textarea{width:100%;font-family:var(--sans);font-size:15px;
  padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--input-bg);
  color:var(--ink);line-height:1.5}
.as-col textarea{resize:vertical}
.as-sec{margin-bottom:26px}
.as-sec h3{font-family:var(--serif);font-size:20px;margin:0 0 8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.sec-head h3{margin:0;border:none}

/* ---- steppers ----
   Sized up from the original 22px buttons / 12-13px text: on a sheet with
   dozens of attribute and skill rows, small tap targets and small type were
   the single biggest readability complaint. */
.attr-grp,.sk-grp{margin-bottom:16px}
.attr-gh,.sk-gh{font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--soft);
  font-weight:700;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(140,120,80,.25)}
.attr-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:4px 20px}
.sk-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 20px}
.attr-row,.sk-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:5px}
.attr-row:hover,.sk-row:hover{background:rgba(140,120,80,.1)}
.attr-n,.sk-n{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attr-v,.sk-v{font-size:13.5px;min-width:118px;text-align:right;font-variant-numeric:tabular-nums;
  color:var(--soft)}
.sk-row.zero .sk-n{color:var(--soft)}
.stp{width:28px;height:28px;line-height:1;border:1px solid var(--line);border-radius:5px;
  background:var(--input-bg);cursor:pointer;color:var(--ink);font-size:16px;padding:0;flex-shrink:0}
.stp:hover{border-color:var(--accent);color:var(--accent)}
/* better values read warmer, worse ones cooler, so the sheet is scannable */
.attr-v.v0,.attr-v.v1{color:#8a6a1e;font-weight:700}
.attr-v.v2,.attr-v.v3{color:#5d7040;font-weight:600}
.attr-v.v5,.attr-v.v6{color:#8a5a4a}
.attr-v.v7,.attr-v.v8{color:#a33;font-weight:600}
.sk-v.l0{opacity:.5}
.sk-v.l12,.sk-v.l13,.sk-v.l14,.sk-v.l15,.sk-v.l16{color:#8a6a1e;font-weight:700}
.sk-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sk-tools input{flex:1;min-width:180px;font-family:var(--sans);font-size:14.5px;padding:7px 10px;
  border:1px solid var(--line);border-radius:4px;background:var(--input-bg)}

/* ---- fortress mode (fortress.js) ---- */
.ft-page .entity-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ft-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ft-head-actions select{font-family:var(--sans);font-size:14px;padding:7px 9px;border:1px solid var(--line);
  border-radius:4px;background:var(--input-bg);color:var(--ink)}
.ft-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.ft-filter{flex:1;min-width:220px;font-family:var(--sans);font-size:14.5px;padding:7px 10px;
  border:1px solid var(--line);border-radius:4px;background:var(--input-bg);color:var(--ink)}
.ft-tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.ft-table{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
.ft-table thead th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:700;
  padding:8px 10px;border-bottom:2px solid var(--line);cursor:pointer;user-select:none;color:var(--soft)}
.ft-table thead th:hover{color:var(--accent)}
.ft-table td{padding:6px 10px;border-bottom:1px solid rgba(140,120,80,.15)}
.ft-row{cursor:pointer}
.ft-row:hover{background:rgba(140,120,80,.08)}
.ft-row.expanded{background:rgba(140,120,80,.12)}
.ft-name{font-weight:700}
.ft-detail td{background:rgba(140,120,80,.06);white-space:normal;padding:12px 16px}
.ft-detail-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.ft-chip{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.ft-chart{width:100%;max-width:760px;height:auto}
.ft-axis{stroke:var(--line);stroke-width:1}
.ft-tick{font-size:10px;fill:var(--soft)}
.ft-line{fill:none;stroke:var(--accent);stroke-width:2}
.ft-dot{fill:var(--accent)}
.ft-warnlist{font-size:12.5px;color:var(--soft);max-height:200px;overflow-y:auto;margin-top:6px;
  border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.ft-errdetail{margin-top:12px;text-align:left;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--soft);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  max-width:640px;margin-left:auto;margin-right:auto}

/* ---- journal / quests ---- */
.jr,.q-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;
  background:var(--panel)}
.jr-head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.jr-t,.q-t{flex:1;font-family:var(--serif);font-size:18px;font-weight:700;border:none;background:none;
  color:var(--ink);border-bottom:1px dashed transparent;padding:2px 0}
.jr-t:hover,.jr-t:focus,.q-t:hover,.q-t:focus{border-bottom-color:var(--line);outline:none}
.jr-x{border:none;background:none;color:var(--soft);font-size:19px;cursor:pointer;padding:3px 7px;
  border-radius:4px;line-height:1}
.jr-x:hover{background:#f0dbd4;color:#a33}
.jr-dates{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.dt-lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--soft);font-weight:700}
.dt{display:inline-flex;gap:4px}
.dt input,.dt select{font-family:var(--sans);font-size:13.5px;padding:5px 8px;border:1px solid var(--line);
  border-radius:4px;background:var(--input-bg);color:var(--ink)}
.dt-y{width:80px}
.jr-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12.5px;
  color:var(--soft)}
.jr-due{background:#f2e3c8;color:#7a5a1e;padding:2px 9px;border-radius:9px;font-weight:600}
.jr-link{background:var(--input-bg);border:1px solid var(--line);border-radius:9px;padding:2px 9px;
  font-size:12px;text-decoration:none}
.q-grp{margin-bottom:18px}
.q-gh{font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:var(--soft);
  display:flex;align-items:center;gap:7px;margin-bottom:6px}
.q-n{background:rgba(0,0,0,.07);border-radius:9px;padding:0 7px}
.q-active .q-gh{color:#3c5c34}
.q-completed .q-gh{color:#5a5a5a}
.q-failed .q-gh{color:#a33}
.q-active .q-item{border-left:3px solid #6d8f5e}
.q-completed .q-item{border-left:3px solid #b3b3b3;opacity:.78}
.q-failed .q-item{border-left:3px solid #b5665a;opacity:.85}
.q-top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.q-top select{font-family:var(--sans);font-size:13.5px;padding:5px 8px;border:1px solid var(--line);
  border-radius:4px;background:var(--input-bg)}

/* ---- associates / inventory rows ---- */
.assoc,.inv-row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.assoc input,.assoc select,.inv-row input,.inv-row select{font-family:var(--sans);font-size:14.5px;
  padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--input-bg);
  color:var(--ink);min-width:0}
.assoc .a-n{width:190px;flex-shrink:0;font-weight:600}
.assoc .a-note,.inv-row input:last-of-type{flex:1}
.a-look{text-decoration:none;font-size:16px;opacity:.6;padding:0 5px}
.a-look:hover{opacity:1}
.inv-head{display:flex;gap:6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--soft);font-weight:700;padding:0 4px 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.inv-head span:nth-child(1){width:190px;flex-shrink:0}
.inv-head span:nth-child(2),.inv-head span:nth-child(3){width:150px;flex-shrink:0}
.inv-head span:nth-child(4){width:64px;flex-shrink:0}
.inv-head span:nth-child(5){flex:1}
.inv-row input:first-child{width:190px;flex-shrink:0;font-weight:600}
.inv-row select{width:150px;flex-shrink:0}
.inv-q{width:64px;flex-shrink:0}

/* ---- tools ---- */
.dice-row{display:flex;gap:6px;margin-bottom:8px}
.dice-row input{flex:1;font-family:var(--mono,monospace);font-size:15px;padding:7px 10px;
  border:1px solid var(--line);border-radius:4px;background:var(--input-bg);color:var(--ink)}
.dice-quick{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.dice-quick button{font-family:var(--sans);font-size:12px;padding:4px 10px;border:1px solid var(--line);
  border-radius:4px;background:var(--input-bg);cursor:pointer;color:var(--ink)}
.dice-quick button:hover{border-color:var(--accent);color:var(--accent)}
.dice-out{text-align:center;padding:16px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);margin-bottom:12px}
.dice-total{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1;color:var(--accent)}
.dice-detail{font-size:12px;color:var(--soft);margin-top:6px}
.dice-log .dl{display:flex;gap:10px;align-items:baseline;font-size:12px;padding:3px 0;
  border-bottom:1px solid rgba(140,120,80,.14)}
.dice-log .dl b{font-variant-numeric:tabular-nums;min-width:38px}
.calc-in{width:100%;font-family:var(--mono,monospace);font-size:16px;padding:8px 10px;
  border:1px solid var(--line);border-radius:4px;background:var(--input-bg);color:var(--ink)}
.calc-out{font-family:var(--serif);font-size:30px;font-weight:700;text-align:right;padding:10px 12px;
  min-height:34px;color:var(--accent)}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.calc-pad button{font-family:var(--sans);font-size:15px;padding:10px;border:1px solid var(--line);
  border-radius:5px;background:var(--input-bg);cursor:pointer;color:var(--ink)}
.calc-pad button:hover{border-color:var(--accent);color:var(--accent)}
.calc-pad button.wide{grid-column:span 3}

/* ---- sheet gallery ---- */
.as-gal{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.asg{margin:0;width:104px;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:var(--panel);position:relative}
.asg.star{outline:2px solid #d9a441;outline-offset:-2px}
.asg img{display:block;width:100%;height:78px;object-fit:cover}
.asg figcaption{font-size:10px;padding:3px 5px;color:var(--soft);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asg-ctl{position:absolute;top:2px;right:2px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.asg:hover .asg-ctl{opacity:1}
.asg-ctl button{border:none;background:rgba(20,15,5,.72);color:#ffd97a;font-size:12px;
  padding:2px 5px;border-radius:4px;cursor:pointer;line-height:1}
.asg-add{width:104px;height:100px;border:1px dashed var(--line);border-radius:6px;background:none;
  cursor:pointer;color:var(--soft);font-size:12px;font-family:var(--sans)}
.asg-add:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{border-color:#c9a49a;color:#a33}
.btn.danger:hover{background:#f3dcd6}

.chronicle-more{border:1px dashed var(--line);border-radius:8px;padding:0 14px;margin-top:22px}
.chronicle-more summary{cursor:pointer;padding:11px 0;font-family:var(--serif);font-size:17px;
  list-style:none;display:flex;align-items:baseline;gap:10px}
.chronicle-more summary::-webkit-details-marker{display:none}
.chronicle-more summary::before{content:'+';color:var(--soft);font-weight:700}
.chronicle-more[open] summary::before{content:'–'}
.chronicle-more summary:hover{color:var(--accent)}
.chronicle-more .lore-block{padding-bottom:10px}

/* ---- the book reader ---- */
.modal.modal-book{max-width:760px;width:92vw}
.bk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.bk-head h3{margin:0;font-family:var(--serif);font-size:22px}
.bk-page{font-family:var(--serif);font-size:16.5px;line-height:1.85;max-height:56vh;
  overflow:auto;padding:6px 20px 6px 4px;text-align:justify;hyphens:auto}
.bk-page p{margin:0 0 1em}
.bk-page p:first-child::first-letter{font-size:2.4em;line-height:0.9;float:left;
  padding:0.05em 0.08em 0 0;color:var(--accent);font-family:var(--serif);font-weight:700}
.bk-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.bk-count{font-family:var(--sans);font-size:12px;color:var(--soft)}
.bk-empty{text-align:center;padding:30px 10px;color:var(--soft);font-size:14px}
.bk-empty .btn{display:block;margin:12px auto 0}
.bk-edit input,.bk-edit textarea{width:100%;font-family:var(--serif);font-size:15px;
  padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--input-bg);
  color:var(--ink);line-height:1.7}
.bk-edit textarea{resize:vertical}
.bk-editacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ---- image generation ---- */
.img-wait{height:5px;background:rgba(140,120,80,.18);border-radius:3px;overflow:hidden;margin-top:10px}
.img-wait-bar{height:100%;width:38%;background:var(--accent);border-radius:3px;
  animation:imgslide 1.5s ease-in-out infinite}
@keyframes imgslide{0%{margin-left:-38%}100%{margin-left:100%}}
.img-result{display:block;max-width:100%;max-height:58vh;margin:0 auto 10px;border:1px solid var(--line);
  border-radius:6px;background:#fff}

/* ---- world update + conflict queue ---- */
.upd-box{max-width:640px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;
  background:var(--panel)}
.upd-box h3{margin:0 0 4px;font-family:var(--serif)}
.upd-box input[type=file]{display:block;width:100%;font-size:12.5px;margin-bottom:4px}
.cf{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;
  padding:12px 14px;margin-bottom:12px;background:var(--panel);max-width:1100px}
.cf-missing{border-left-color:#b5665a}
.cf-renamed{border-left-color:#c9a441}
.cf-h{font-family:var(--serif);font-size:16px;margin-bottom:2px;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.cf-tag{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;
  background:rgba(0,0,0,.07);color:var(--soft);border-radius:9px;padding:1px 8px}
.cf-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
@media (max-width:900px){.cf-cols{grid-template-columns:1fr}}
.cf-lab{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--soft);
  font-weight:700;margin-bottom:4px}
.cf-txt{font-family:var(--serif);font-size:13px;line-height:1.6;padding:8px 10px;
  border:1px solid var(--line);border-radius:6px;background:var(--input-bg);
  max-height:190px;overflow:auto}
.cf-col.mine .cf-txt{border-color:#b9a05e;background:#fdf7e6}
.cf-txt.old{opacity:.72}
.cf-acts{display:flex;gap:6px;flex-wrap:wrap}

/* ---- AI prompt editor ---- */
.pr-sec{margin-bottom:26px;max-width:900px}
.pr-sec textarea{width:100%;font-family:var(--mono,ui-monospace,Menlo,Consolas,monospace);
  font-size:12.5px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);
  border-radius:6px;background:var(--input-bg);color:var(--ink);resize:vertical}
.pr-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.pr-row label{font-size:12.5px;display:flex;align-items:center;gap:6px}
.pr-row input[type=number]{width:64px;padding:4px 7px;border:1px solid var(--line);
  border-radius:4px;background:var(--input-bg)}
.pr-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.pr-item{display:flex;gap:6px;align-items:center}
.pr-item input{flex:1;font-family:var(--sans);font-size:13px;padding:5px 8px;
  border:1px solid var(--line);border-radius:4px;background:var(--input-bg);color:var(--ink)}
.pr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:24px 0 40px;
  padding-top:16px;border-top:1px solid var(--line);max-width:900px}
.pr-preview{white-space:pre-wrap;font-family:var(--mono,ui-monospace,Menlo,Consolas,monospace);
  font-size:11.5px;line-height:1.6;background:var(--input-bg);border:1px solid var(--line);
  border-radius:6px;padding:12px;max-height:52vh;overflow:auto}

/* ---- nav dropdown (Cartography) ---- */
.tabdrop{position:relative;display:inline-block}
.tabdrop > a{display:inline-block}
.tabdrop-menu{display:none;position:absolute;left:0;top:calc(100% + 2px);z-index:130;min-width:250px;
  background:var(--input-bg);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 8px 24px rgba(50,38,14,.24);padding:5px;flex-direction:column}
.tabdrop.open .tabdrop-menu{display:flex}
.tabdrop-menu a{display:block;padding:8px 11px;border-radius:4px;font-size:13.5px;
  text-decoration:none;color:var(--ink)}
.tabdrop-menu a:hover{background:#efe6cd;color:var(--accent)}
.tabdrop-menu small{display:block;font-size:11px;color:var(--soft);margin-top:1px}

/* ---- THE MAP WALL ---- */
#wallView{display:flex;width:100%;border-top:1px solid var(--line);min-height:0}
#wallStage{flex:1;position:relative;overflow:hidden;background:#0d1826;min-width:0}
#wallCanvas{display:block;width:100%;height:100%;cursor:grab}
#wallChrome{width:268px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:10px 12px;font-family:var(--sans);font-size:12.5px}
.wsec{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.wsec:last-child{border-bottom:none}
.wlab{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--soft);
  font-weight:700;margin-bottom:6px}
#wallChrome select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:4px;
  background:var(--input-bg);font-family:var(--sans);font-size:12.5px;margin-bottom:6px}
.wrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
#wallChrome button{padding:5px 10px;border:1px solid var(--line);border-radius:4px;
  background:var(--input-bg);cursor:pointer;font-family:var(--sans);font-size:12px;color:var(--ink)}
#wallChrome button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
#wallChrome button:disabled{opacity:.4;cursor:default}
#wallChrome button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wtools button{font-size:15px;min-width:36px}
.wtools button svg{width:18px;height:18px;fill:currentColor;vertical-align:middle}
.whint{font-size:10.5px;color:var(--soft);line-height:1.5;margin-top:4px}
.wsnap{display:flex;align-items:center;gap:5px;font-size:12px}
.wsnap select{width:auto;margin-bottom:0}
/* palette swatches: one row of ten, big enough to hit, labelled by tooltip */
.wpal{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}
.wsw{height:26px;min-width:0;border:2px solid transparent;border-radius:4px;cursor:pointer;padding:0}
.wsw:hover{border-color:var(--soft)}
.wsw.on{border-color:#1d1408;box-shadow:0 0 0 2px #ffd97a}
/* expanded shade ramps: one row per biome, light -> dark */
.wramp{margin-top:6px}
.wrampn{display:block;font-size:10px;color:var(--soft);letter-spacing:.4px;margin-bottom:2px}
.wrampr{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.wrampr .wsw{height:20px}
/* the colour currently loaded in the brush */
.wcur{width:22px;height:22px;border-radius:4px;border:2px solid var(--line);
  display:inline-block;margin-left:auto;flex-shrink:0}

/* ---- header settings dropdown ---- */
.settings-wrap{position:relative;display:inline-block}
.settings-menu{display:none;position:absolute;right:0;top:calc(100% + 5px);z-index:120;min-width:236px;
  background:var(--input-bg);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 8px 24px rgba(50,38,14,.24);padding:5px;flex-direction:column}
.settings-wrap.open .settings-menu{display:flex}
.settings-menu button{font-family:var(--sans);font-size:13px;text-align:left;background:none;border:none;
  padding:8px 11px;border-radius:4px;cursor:pointer;color:var(--ink)}
.settings-menu button:hover{background:#efe6cd;color:var(--accent)}
.sm-check{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13px;
  padding:8px 11px;cursor:pointer}
.sm-check:hover{background:#efe6cd;border-radius:4px}
.sm-sep{height:1px;background:var(--line);margin:4px 6px}
.sm-theme{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:var(--sans);padding:6px 11px}
.sm-theme-lab{font-size:13px;color:var(--ink)}
.sm-theme select{font-family:var(--sans);font-size:12.5px;padding:4px 6px;border:1px solid var(--line);
  border-radius:4px;background:var(--input-bg);color:var(--ink)}

/* ---- LEAD PARAGRAPH: the one-sentence "what is this" opener ---- */
.lead-para{font-family:var(--serif);font-size:18px;line-height:1.75;margin:2px 0 18px;
  max-width:64ch;color:var(--ink);text-wrap:pretty}
.lead-para strong{font-weight:700}

/* ---- CONTENTS BOX ---- */
.toc{display:inline-block;min-width:250px;max-width:340px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;margin:0 0 22px;padding:0;
  font-family:var(--sans);clear:left}
.toc-head{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;user-select:none;
  border-bottom:1px solid transparent}
.toc.open .toc-head{border-bottom-color:var(--line)}
.toc-head:hover{color:var(--accent)}
.toc-arrow{font-size:11px;color:var(--soft);transition:transform .15s;display:inline-block}
.toc:not(.open) .toc-arrow{transform:rotate(-90deg)}
.toc-title{font-weight:700;font-size:14px;flex:1}
.toc-count{font-size:11px;color:var(--soft);background:rgba(0,0,0,.06);border-radius:9px;padding:1px 7px}
.toc-list{display:none;margin:0;padding:8px 14px 12px 14px;list-style:none;counter-reset:toc}
.toc.open .toc-list{display:block}
.toc-list li{margin:0 0 3px}
.toc-list a{display:flex;gap:9px;font-size:13.5px;text-decoration:none;color:var(--accent);
  padding:2px 0;line-height:1.5}
.toc-list a:hover{text-decoration:underline}
.toc-n{color:var(--soft);min-width:16px;font-variant-numeric:tabular-nums}

/* ---- gallery star ---- */
.gallery-item{position:relative}
.gi-star{position:absolute;top:3px;right:3px;border:none;background:rgba(20,15,5,.55);color:#ffd97a;
  font-size:15px;line-height:1;padding:3px 6px;border-radius:5px;cursor:pointer;opacity:0;transition:opacity .12s}
.gallery-item:hover .gi-star,.gallery-item.starred .gi-star{opacity:1}
.gi-star:hover{background:rgba(20,15,5,.8)}
.gallery-item.starred{outline:2px solid #d9a441;outline-offset:-2px;border-radius:6px}

/* ---- EVENT / TIMELINE TABLES: compact, alternating, scannable ---- */
.ev-table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13.5px;margin:4px 0 8px}
.ev-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--soft);
  padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600}
.ev-table td{padding:6px 10px;border-bottom:1px solid rgba(140,120,80,.14);vertical-align:top;line-height:1.5}
.ev-table tbody tr:nth-child(odd){background:rgba(140,120,80,.055)}
.ev-table tbody tr:hover{background:rgba(140,120,80,.13)}
.ev-table .ev-y{white-space:nowrap;color:var(--soft);font-variant-numeric:tabular-nums;width:1%;font-weight:600}

/* ---- TYPOGRAPHY HIERARCHY ---- */
h1{font-size:33px;line-height:1.18;margin:0 0 2px;letter-spacing:-.005em}
.section h3{font-size:21px;font-family:var(--serif);font-weight:700}
.lore-h{font-size:19px}
.wrap h2{font-size:25px;font-family:var(--serif);margin:26px 0 8px;
  border-bottom:1px solid var(--line);padding-bottom:4px}
/* stop sections colliding with the floated infobox */
.section{clear:none}
.section:first-of-type{margin-top:14px}

/* ---- header: flat toolbar ---- */
#randomBtn{white-space:nowrap}
header .icon-btn{border-radius:3px}

.card.orphan{opacity:.62;border-left-color:#b5665a}
.orphan-tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;
  background:#f0dbd4;color:#a33;border-radius:9px;padding:1px 7px;margin-left:5px}
body.dark-mode .orphan-tag{background:#4a2b28;color:#f0a094}

/* ---- colour by entity type ----
   Each kind of thing gets its own hue, used consistently wherever it
   appears. Nav tab, card accent, crumb, section rule. Previously every
   accent on every page was the same maroon. */
nav.tabs a[data-t=hf].active,nav.tabs a[data-t=hf]:hover{color:var(--c-hf);border-bottom-color:var(--c-hf)}
nav.tabs a[data-t=site].active,nav.tabs a[data-t=site]:hover{color:var(--c-site);border-bottom-color:var(--c-site)}
nav.tabs a[data-t=ent].active,nav.tabs a[data-t=ent]:hover{color:var(--c-ent);border-bottom-color:var(--c-ent)}
nav.tabs a[data-t=artifact].active,nav.tabs a[data-t=artifact]:hover{color:var(--c-artifact);border-bottom-color:var(--c-artifact)}
nav.tabs a[data-t=wc].active,nav.tabs a[data-t=wc]:hover{color:var(--c-wc);border-bottom-color:var(--c-wc)}
nav.tabs a[data-t=creature].active,nav.tabs a[data-t=creature]:hover{color:var(--c-creature);border-bottom-color:var(--c-creature)}
.card[data-type=hf]{border-left:3px solid var(--c-hf)}
.card[data-type=site]{border-left:3px solid var(--c-site)}
.card[data-type=ent]{border-left:3px solid var(--c-ent)}
.card[data-type=artifact]{border-left:3px solid var(--c-artifact)}
.card[data-type=wc]{border-left:3px solid var(--c-wc)}
.card[data-type=creature]{border-left:3px solid var(--c-creature)}
.card[data-type=region]{border-left:3px solid var(--c-region)}
/* the page itself takes its type's colour for headings and rules */
body[data-etype=hf]{--accent:var(--c-hf)}
body[data-etype=site]{--accent:var(--c-site)}
body[data-etype=ent]{--accent:var(--c-ent)}
body[data-etype=artifact]{--accent:var(--c-artifact)}
body[data-etype=wc]{--accent:var(--c-wc)}
body[data-etype=creature]{--accent:var(--c-creature)}
body[data-etype=region]{--accent:var(--c-region)}
.kind{letter-spacing:1.2px;text-transform:uppercase;font-size:11px;font-weight:700;color:var(--accent)}
/* badges and pills pick up hue rather than all being one brown */
.badge-wordbank{background:#efe6cd;color:#7a6b4a}
.badge-edited{background:#dfe9d8;color:#2f6b3f}
.badge-llm{background:#e6dced;color:#63406b}
.ar-status{background:#dfe9d8;color:#3c5c34}

/* =========================================================================
   ARTICLE LAYOUT
   Contents rail on the left, prose in the middle, infobox and gallery on
   the right. The rail is sticky and collapsible; the measure stays capped
   so the reading column doesn't stretch when the rail is hidden.
   ========================================================================= */
body.has-rail main{max-width:1500px}
.article{display:grid;grid-template-columns:230px minmax(0,1fr);gap:30px;align-items:start}
/* When the rail is hidden it leaves the grid entirely, so the article body
   becomes the FIRST grid item and lands in the 230px column, which is why
   the page rendered crushed against the left edge, and why opening the
   contents box appeared to "fix" it. Collapse the track in CSS rather than
   relying on a JS class staying in sync. */
body.rail-hidden .article{grid-template-columns:minmax(0,1fr)}
.article.no-rail{grid-template-columns:minmax(0,1fr)}
.rail{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow-y:auto;overflow-x:hidden;
  font-family:var(--sans);padding-right:4px}
.rail:hover{overflow-x:auto}
.rail-hidden .rail{display:none}
.rail-toggle{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:60;
  writing-mode:vertical-rl;background:var(--panel);border:1px solid var(--line);
  border-radius:0 6px 6px 0;padding:12px 5px;cursor:pointer;font-size:11px;
  letter-spacing:1px;color:var(--soft);display:none}
.rail-hidden .rail-toggle{display:block}
.rail-toggle:hover{color:var(--accent);border-color:var(--accent)}
/* the article body itself keeps a comfortable measure and sits centred
   within its column rather than sprawling */
.article-body{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 360px;
  column-gap:32px;align-items:start}
.main-col{min-width:0}
.article-body .lore-text,.article-body .lead-para{max-width:68ch}
@media (max-width:1100px){
  .article{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;margin-bottom:18px}
}
@media (max-width:900px){
  .article-body{grid-template-columns:minmax(0,1fr)}
  .sidebar-col{order:-1}
}

/* ---- INFOBOX (Wikipedia-style sidebar) ---- */
.factbox{width:100%;margin:2px 0 24px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:0 0 10px;box-shadow:var(--shadow);
  font-family:var(--sans);font-size:14px;overflow:hidden}
/* the starred image, leading the record */
.fb-portrait{margin:0;cursor:zoom-in;border-bottom:1px solid var(--line);background:var(--chip)}
.fb-portrait img{display:block;width:100%;height:auto;max-height:340px;object-fit:cover}
.fb-portrait figcaption{font-size:11px;color:var(--soft);padding:5px 12px 6px;line-height:1.4;
  text-align:center}
.factbox .fb-title{font-family:var(--serif);font-size:17px;font-weight:700;text-align:center;
  padding:12px 16px 10px;border-bottom:2px solid var(--line);background:rgba(180,150,90,.12);
  border-radius:8px 8px 0 0;letter-spacing:.01em;margin:0}
.fb-table{width:100%;border-collapse:collapse}
.fb-table th,.fb-table td{padding:9px 14px;vertical-align:top;line-height:1.5}
.fb-table th{text-align:right;font-weight:600;color:var(--soft);white-space:nowrap;
  width:38%;font-size:13px;border-right:1px solid rgba(140,120,80,.18)}
.fb-table td{text-align:left;font-weight:600}
.fb-table tr+tr th,.fb-table tr+tr td{border-top:1px solid rgba(140,120,80,.16)}
.fb-table tr:nth-child(even){background:rgba(140,120,80,.05)}
.fb-custom td{font-weight:500;position:relative;padding-right:26px}
.fb-x{position:absolute;right:6px;top:5px;border:none;background:none;color:var(--soft);
  cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;opacity:0;transition:opacity .12s}
.fb-custom:hover .fb-x{opacity:1}
.fb-x:hover{background:#f0dbd4;color:#a33}
.fb-add{padding:10px 14px 6px;border-top:1px solid var(--line);margin-top:2px}
.fb-hint{font-size:11px;color:var(--soft);line-height:1.45;margin-top:3px}
.section{margin:22px 0}
.section h3{font-size:20px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:baseline}
.section h3 .n{font-family:var(--sans);font-size:12px;color:var(--soft);font-weight:400}
.events li{margin:0 0 7px;padding-left:2px;list-style:none}
.events .ey{font-family:var(--sans);font-size:12px;color:var(--accent);font-weight:700;
  display:inline-block;min-width:38px}
.events ul{padding:0;margin:0}
.events .cat{font-family:var(--sans);font-size:10px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;
  border:1px solid var(--line);border-radius:8px;padding:0 5px;margin-left:6px}
.expander{font-family:var(--sans);font-size:13px;color:var(--accent);cursor:pointer;user-select:none;
  border:none;background:none;padding:6px 0}
.rel-list,.link-list{list-style:none;padding:0;margin:0;font-family:var(--sans);font-size:14px}
.rel-list li,.link-list li{padding:3px 0;border-bottom:1px dotted var(--line)}
.rel-list .rt{color:var(--soft);text-transform:capitalize}
.structures{columns:2;font-family:var(--sans);font-size:13px}
.structures div{break-inside:avoid;padding:2px 0}
.struct-t{color:var(--soft);font-size:11px;text-transform:uppercase}

/* ===================== CHARACTER (wiki-style prose sections) ===================== */
.lore-block{max-width:700px}
.lore-section{margin:0 0 4px}
.lore-section-empty{margin:0 0 4px;padding-bottom:8px}
.lore-section-empty .btn{margin-top:4px}
.lore-h{display:flex;align-items:baseline;gap:10px;font-size:19px;font-family:var(--serif);
  border-bottom:1px solid var(--line);padding:10px 0 4px;margin:0;justify-content:space-between}
.lore-title{flex:1}
.lore-controls{display:flex;align-items:center;gap:9px;flex-shrink:0}
.src-badge{font-family:var(--sans);font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;
  padding:1px 6px;border-radius:8px;font-weight:600;user-select:none;white-space:nowrap}
.badge-wordbank{background:#e7dcc4;color:#7a6b4a}
.badge-edited{background:#dcead9;color:#2f6b3f}
.badge-llm{background:#f5d9d9;color:#a23b3b}
.lore-toggle{font-family:var(--sans);font-size:11px;color:var(--soft);font-weight:400;border:none;background:none;cursor:pointer;padding:0}
.lore-toggle:hover{color:var(--accent);text-decoration:underline}
/* ============================================================
   READABILITY
   Body prose gets the treatment long-form text actually wants:
   a slightly larger serif face, generous leading, and. Most
   importantly. A capped measure. Lines longer than roughly 70
   characters are measurably harder to track back to the start of
   the next line, and this text was running the full column width.
   ============================================================ */
.lore-text{font-family:var(--serif);font-size:17.5px;line-height:1.78;padding:10px 0 22px;
  color:var(--ink);max-width:68ch;letter-spacing:.005em;text-wrap:pretty}
.lore-section{margin:0 0 10px;padding-bottom:2px}
.lore-section + .lore-section{border-top:1px solid rgba(140,120,80,.16);padding-top:14px}
.lore-h{margin-bottom:2px}
/* controls fade back until you're actually looking at that section */
.lore-controls{opacity:.32;transition:opacity .15s}
.lore-section:hover .lore-controls,
.lore-controls:focus-within,
.tools-wrap.open .lore-controls{opacity:1}
.lore-h .lore-title{letter-spacing:.01em}
/* first line of each section reads as an opening, not a continuation */
.lore-text::first-line{letter-spacing:.012em}

/* ---- Tools popover ---- */
.tools-wrap{position:relative;display:inline-block}
.tools-menu{display:none;position:absolute;right:0;top:100%;z-index:60;min-width:190px;
  background:var(--input-bg,#fffdf7);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 22px rgba(50,38,14,.22);padding:5px;flex-direction:column}
.tools-wrap.open .tools-menu{display:flex}
.tools-menu button{font-family:var(--sans);font-size:12.5px;text-align:left;background:none;
  border:none;padding:7px 10px;border-radius:5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.tools-menu button:hover{background:#efe6cd;color:var(--accent)}
.tools-menu button.danger:hover{background:#f3dcd6;color:#a33}
.lore-toggle.sec-img.active{color:var(--accent);font-weight:600}

/* ---- per-section inline gallery: pushes prose down, never overlaps ---- */
.section-gallery{margin:6px 0 2px}
.sg-grid{display:flex;flex-wrap:wrap;gap:10px}
.sg-item{margin:0;cursor:zoom-in;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--panel);max-width:260px;transition:transform .12s,box-shadow .12s}
.sg-item:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(60,45,20,.22)}
.sg-item img{display:block;width:100%;height:auto}
.sg-empty{font-size:12.5px;color:var(--soft);padding:6px 0 10px}

/* ---- roomier vital record ---- */
.age-at-death{color:var(--soft);font-weight:400;font-size:.92em;white-space:nowrap}
.fb-group{margin:12px 14px 0;padding-top:10px;border-top:1px solid rgba(140,120,80,.18)}
.fb-group:first-child{border-top:none;margin-top:6px}
.fb-line{font-size:12.5px;line-height:1.55;margin-bottom:2px}
.lore-text.collapsed{display:none}
.lore-text.overridden{border-left:2px solid var(--accent2);padding-left:10px}
.lore-edit-box{width:100%;min-height:90px;font-family:var(--serif);font-size:15px;line-height:1.5;
  padding:8px;border:1px solid var(--accent);border-radius:6px;background:var(--input-bg);resize:vertical}
.lore-edit-actions{display:flex;gap:8px;margin-top:6px}
/* Drop cap. The old rule set a 44px glyph inside a 34px line box, so the
   letter overflowed its own line. Fine when the paragraph had loose padding
   above it, clipped once the new layout tightened that up. Sized in em so it
   tracks the body text, with a line-height that actually contains it. */
/* Drop cap.
   Two attempts with ::first-letter both misbehaved, that pseudo-element's
   box is sized by the line box around it, so it clipped or vanished
   depending on surrounding padding. It's a real <span> now: fully
   controllable and immune to line-box maths. */
.dropcap{float:left;font-family:var(--serif);font-size:3.2em;line-height:0.82;
  padding:0.06em 0.10em 0 0;margin:0.02em 0 0;color:var(--accent);font-weight:700;
  -webkit-user-select:none;user-select:none}
.lore-block .lore-section:first-of-type .lore-text{padding-top:12px;overflow:visible}
.lore-text.has-dropcap::after{content:'';display:block;clear:both}
.ornament{text-align:center;color:var(--line);font-size:18px;letter-spacing:8px;margin:22px 0}

/* ===================== GALLERY ===================== */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gallery-item{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;background:#e5dabf}
.gallery-item img{width:100%;height:140px;object-fit:cover;display:block}
.gallery-item .gi-cap{font-family:var(--sans);font-size:11px;color:var(--soft);padding:5px 7px;
  background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-sidebar{margin-top:14px}
.gallery-grid-sb{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.gallery-grid-sb .gallery-item img{height:74px}
.gallery-grid-sb .gallery-item .gi-cap{font-size:9.5px;padding:3px 5px}
.map-swatch-box{margin-top:14px}
.map-swatch-img{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--shadow);image-rendering:pixelated;margin-top:8px}
.map-swatch-pin{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.lightbox-img{max-width:100%;max-height:65vh;display:block;margin:0 auto;border-radius:6px}
.lightbox-cap{font-family:var(--sans);font-size:13px;color:var(--soft);text-align:center;margin-top:8px}

/* ===================== NOTES ===================== */
.notes-block{margin-top:30px;border-top:3px double var(--line);padding-top:14px}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent2);
  border-radius:6px;padding:11px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.note h4{margin:0 0 5px;font-size:17px}
.note .ntext{white-space:pre-wrap}
.note .nmeta{font-family:var(--sans);font-size:11px;color:var(--soft);margin-top:7px;display:flex;gap:12px}
.note .nmeta button{border:none;background:none;color:var(--accent);cursor:pointer;font-size:11px;padding:0}
.note-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note-imgs img{max-width:180px;max-height:150px;border:1px solid var(--line);border-radius:4px}
.note-history{margin-top:6px;font-family:var(--sans);font-size:12px}
.note-history details{color:var(--soft)}
.note-history .ver{border-left:2px solid var(--line);padding:3px 0 3px 8px;margin:4px 0;white-space:pre-wrap}
.add-note-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent2);color:#fff;border:none;
  border-radius:6px;padding:8px 14px;cursor:pointer;font-family:var(--sans);font-size:14px}
.add-note-btn:hover{background:#2f4a34}
.wikilink{background:rgba(58,90,64,.12);border-bottom:1px dashed var(--accent2);color:var(--accent2)}

/* ===================== CONTEXT MENU / MODAL ===================== */
#ctx{position:fixed;z-index:200;background:var(--input-bg);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 26px rgba(40,25,5,.28);display:none;min-width:190px;overflow:hidden;font-family:var(--sans);font-size:13px}
#ctx .ci{padding:8px 13px;cursor:pointer;display:flex;align-items:center;gap:9px}
#ctx .ci:hover{background:#f0e7d0}
#ctx .ci svg{width:14px;height:14px;fill:var(--soft)}
#ctx .sep{height:1px;background:var(--line);margin:3px 0}
#ctx .sub{position:relative}
#ctx .submenu{display:none;position:absolute;left:100%;top:0;background:var(--input-bg);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 26px rgba(40,25,5,.28);min-width:150px}
#ctx .sub:hover .submenu{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(30,20,5,.42);z-index:300;display:none;align-items:center;justify-content:center}
.modal{background:var(--panel);border-radius:10px;max-width:560px;width:92%;max-height:88vh;overflow-y:auto;
  padding:22px;box-shadow:0 12px 40px rgba(20,12,0,.4)}
.modal h3{margin:0 0 14px}
.modal label{font-family:var(--sans);font-size:12px;color:var(--soft);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.modal input[type=text],.modal textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;
  background:var(--input-bg);font-family:var(--serif);font-size:15px}
.modal textarea{min-height:150px;resize:vertical;line-height:1.5}
.modal .hint{font-family:var(--sans);font-size:11px;color:var(--soft);margin-top:4px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--input-bg);cursor:pointer;font-family:var(--sans);font-size:14px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--link-hover)}

/* ===================== STATS ===================== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat .num{font-size:30px;font-weight:700;color:var(--accent)}
.stat .lbl{font-family:var(--sans);font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.bar-row{display:flex;align-items:center;gap:10px;margin:4px 0;font-family:var(--sans);font-size:13px}
.bar-row .bn{width:150px;text-align:right;color:var(--soft)}
.bar-row .bt{flex:1;background:#e5dabf;border-radius:4px;overflow:hidden;height:16px}
.bar-row .bf{background:var(--accent2);height:100%;display:block}
.bar-row .bv{width:56px;font-variant-numeric:tabular-nums}

.loading{text-align:center;padding:40px;color:var(--soft);font-family:var(--sans)}
.empty{text-align:center;padding:40px;color:var(--soft);font-family:var(--sans);font-style:italic}
.tl-item{display:flex;gap:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.tl-item .tly{font-family:var(--sans);font-weight:700;color:var(--accent);min-width:50px;text-align:right}
.folder-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);
  margin:20px 0 8px;padding-bottom:5px}
.folder-head h3{margin:0}

/* ===================== PRINT ===================== */
@media print{
  header,nav.tabs,#ctx,.modal-bg,.entity-actions,.top-actions,.add-note-btn,.expander,.pager,.toolbar,
  .note .nmeta button,.note-history summary,.lore-toggle,.ornament,#versionTag,.page-stats,.src-badge{display:none !important}
  body{background:#fff;color:#000;font-size:12pt}
  a{color:#000;border:none}
  main{max-width:100%;padding:0}
  .wrap{max-width:100%}
  .factbox{border:1px solid #999;box-shadow:none;width:230px}
  .card,.note,.stat{box-shadow:none;border:1px solid #bbb}
  .entity-head,.hero,.notes-block{border-color:#000}
  .section h3{border-color:#666}
  .note{border-left:3px solid #000;break-inside:avoid}
  .events li{break-inside:avoid}
  .cat{display:none}
  h1,h2,h3{color:#000}
  .hl{break-inside:avoid}
  body.print-no-images .note-imgs,
  body.print-no-images .ac-map,
  body.print-no-images .map-shell,
  body.print-no-images .gallery-grid,
  body.print-no-images img{display:none !important}
}
.print-toggle{display:flex;align-items:center;gap:5px;font-family:var(--sans);font-size:12px;color:var(--soft);
  background:var(--input-bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;user-select:none}
.print-toggle input{cursor:pointer}
#versionTag{position:fixed;bottom:6px;right:10px;font-family:var(--sans);font-size:10.5px;color:var(--line);
  z-index:1;pointer-events:none;letter-spacing:.3px}
#backToTop{position:fixed;bottom:22px;right:22px;width:42px;height:42px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:18px;cursor:pointer;z-index:80;
  box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#backToTop.show{opacity:.88;pointer-events:auto}
#backToTop:hover{opacity:1;transform:translateY(-2px)}
/* --- map/globe take the full window, not the 1180px reading column --- */
body.map-mode main{max-width:none;margin:0;padding:0}
body.map-mode{overflow:hidden}
#mapView{display:flex;flex-direction:column;width:100%;
  border-top:1px solid var(--line);background:var(--bg)}
#mapView #main{min-height:0}
/* the map's sidebar should read as part of the wiki, not a bolted-on panel */
#mapView #sidebar{border-left:1px solid var(--line)}
/* dark mode: the parchment map panels would glare against a dark page */
body.dark-mode #mapView{filter:none}
body.dark-mode #mapView #sidebar,
body.dark-mode #mapView #layoutPanel{background:#221f1a;color:#e8e2d4}
body.dark-mode #mapView .sb-tab{color:#bdb4a2}
body.dark-mode #mapView .sb-tab.active{color:#e8c98a}
@media print{ body.map-mode #mapView{height:auto!important} }
[hidden]{display:none!important}
